  var playing = S.walk && S.walk.playing && !S.walk.arrived;
  b.innerHTML = (playing ? pause : play) + '<span id="btn-play-text">' +
    (playing ? t('pause') : (S.walk && S.walk.s > 0 && !S.walk.arrived ? t('resume') : t('start'))) +
    '</span>';
}

function updatePlayButtonLabel() { setPlayButton(false); }

function renderQuality(route) {
  document.getElementById('quality').hidden = false;
  var st = route.stats;
  updateModeNote();

  setText('q-len', Math.round(st.length) + ' ' + t('meters'));
  setText('q-time', estMinutes(route) + ' ' + t('minutes'));

  var totalStairs = st.stairs + st.escalator;
  setText('q-stairs', String(totalStairs));
  document.getElementById('q-stairs-box').className =
    'q-item ' + (totalStairs === 0 ? 'q-good' : 'q-bad');

  /* 坡度唔用顏色標示。綠／紅會斷言「達標／唔達標」，但政府數據分唔開
     陡斜路同冇名樓梯（見 CONFIG.SLOPE_CLAMPED），我哋冇資格咁斷言。
     所以如實列出數字，唔加判斷。 */
  var slopePct = Math.round(st.maxUp * 100);
  setText('q-slope', slopePct + '%');
  document.getElementById('q-slope-box').className = 'q-item';

  setText('q-cover', Math.round(st.coveredPct) + '%');
  document.getElementById('q-cover-box').className =
    'q-item ' + (st.coveredPct >= 50 ? 'q-good' : '');

  setText('q-lift', String(st.lift));

  // 對照最短路線 —— 用嚟顯示「普通導航會點行」
  var alt = computeShortest(route);
  if (alt) {
    /* 對照行唔再印坡度。兩條路線通常會用到同一段斜路，印出同一個數字
       只會令對照顯得冇意思；呢張卡嘅重點係「普通導航會叫你行樓梯」。 */
    setText('q-compare', fmt(t('cmp'), {
      len: Math.round(alt.stats.length),
      stairs: alt.stats.stairs + alt.stats.escalator
    }));
    var avoided = (alt.stats.stairs + alt.stats.escalator) - totalStairs;
    if (avoided > 0) {
      document.getElementById('q-compare').textContent += ' · ' +
        fmt(t('cmpOk'), { n: avoided });
    }
  }

  // 誠實警告 —— 唔可以扮到條條路都無障礙
  var warns = [];
  /* 坡度只作中性陳述，唔再當成警告。原因同上面嘅顏色決定一樣：個數字
     唔夠可信去叫用戶「小心」或者「考慮他人協助」。 */
  if (st.maxUp > CONFIG.STEEP_WARN) {
    warns.push(fmt(t('wSteep'), { p: slopePct }));
  }
  if (totalStairs > 0) warns.push(t('wStairs'));
  /* 雨天誠實指標。
   * 實測：路線 B 嘅有蓋比例喺權重 0.6/3.0 至 0.15/20 之間全部飽和喺 10.8%
   * —— 即係「有蓋 10.8%」唔係因為權重唔夠力，而係實際有蓋路段就係咁少。
   * 所以唔可以扮「雨天路線幫你避晒雨」，要如實講出仲有幾多米露天。 */
  if (S.rain && st.coveredPct < 40) {
    warns.push(fmt(t('wOpenAir'), { m: Math.round(st.length - st.coveredLen) }));
  }
  setText('q-warn', warns.join(' '));
}

function estMinutes(route) {
  var speed = (S.routeKey === 'A') ? CONFIG.WHEEL_SPEED : CONFIG.ELDER_SPEED;
  return Math.max(1, Math.round(route.total / speed / 60));
}

function computeShortest(route) {
  var s = nearestNode(POIS[ORIGIN].lng, POIS[ORIGIN].lat).idx;
  var g = nearestNode(POIS[PRESETS[S.routeKey].to].lng,
                      POIS[PRESETS[S.routeKey].to].lat).idx;
  var p = astar(s, g, true, false);
  return p ? buildStatsOnly(p) : null;
}

/* 唔建完整路線，只要統計 */
function buildStatsOnly(path) {
  var st = { length: 0, stairs: 0, escalator: 0, lift: 0, coveredLen: 0,
             steepLen: 0, maxUp: 0, maxDown: 0, coveredPct: 0 };
  for (var i = 0; i < path.length - 1; i++) {
    var ei = edgeBetween(path[i], path[i + 1]);
    if (ei < 0) continue;
    var e = GRAPH.edges[ei];
    st.length += e[2];
    if (e[4] & F.STAIRS) st.stairs++;
    if (e[4] & F.ESCALATOR) st.escalator++;
    if (e[4] & F.LIFT) st.lift++;
    if (e[4] & F.COVERED) st.coveredLen += e[2];
    if (e[3] > 0.005 && e[3] < CONFIG.SLOPE_CLAMPED) st.maxUp = Math.max(st.maxUp, e[3]);
    else if (e[3] < -0.005 && e[3] > -CONFIG.SLOPE_CLAMPED) st.maxDown = Math.max(st.maxDown, -e[3]);
  }
  st.coveredPct = st.length > 0 ? 100 * st.coveredLen / st.length : 0;
  return { stats: st };
}

var ARROW_PATHS = {
  straight:      'M24 42V14M13 25L24 14l11 11',
  left:          'M24 42V16M24 16h-9M24 16l-8 8M24 16l-8-8',
  right:         'M24 42V16M24 16h9M24 16l8 8M24 16l8-8',
  'slight-left': 'M16 42l6-24M22 18l-8-2M22 18l-3-8',
  'slight-right':'M32 42l-6-24M26 18l8-2M26 18l3-8',
  uturn:         'M34 42V20a8 8 0 00-16 0v6M18 26l-5 6 5 6',
  /* 升降機：車廂外框 + 一上一落兩支箭嘴。同設施圖標一樣用形狀區分，
     唔用 emoji（設計硬要求）。 */
  lift:          'M13 8h22v32H13zM14 19h20M19.5 32V20M16 23.5L19.5 20l3.5 3.5'
                 + 'M28.5 16v12M25 24.5l3.5 3.5 3.5-3.5',
  arrive:        'M24 6a9 9 0 100 18 9 9 0 000-18M20 15l3 3 6-6'
};

function renderTurn(dir, text, sub, warn) {
  var a = document.getElementById('turn-arrow');
  if (a) a.innerHTML = '<path d="' + (ARROW_PATHS[dir] || ARROW_PATHS.straight) + '"/>';
  setText('instr-text', text);
  setText('instr-sub', sub || '');
  var w = document.getElementById('instr-warn');
  if (warn) { w.textContent = warn; w.className = 'on'; }
  else { w.textContent = ''; w.className = ''; }
}

/* 目前應該做嘅轉向 */
function currentManeuver(route, s) {
  for (var i = 0; i < route.maneuvers.length; i++) {
    var m = route.maneuvers[i];
    if (s < m.s + 12) return m;
  }
  return null;
}

function updateProgress(route, s) {
  var remain = Math.max(0, route.total - s);
  setText('prog-text', Math.round(remain) + ' ' + t('meters'));
  var mins = Math.max(1, Math.round(remain /
    ((S.routeKey === 'A') ? CONFIG.WHEEL_SPEED : CONFIG.ELDER_SPEED) / 60));
  setText('prog-sub', t('minutes') + ' ' + mins);
  var pct = route.total > 0 ? Math.min(100, 100 * s / route.total) : 0;
  document.getElementById('bar-fill').style.width = pct + '%';

  var m = currentManeuver(route, s);
  if (m) {
    var dirWord = t(m.dir === 'left' ? 'turnLeft'
                  : m.dir === 'right' ? 'turnRight'
                  : m.dir === 'slight-left' ? 'slightLeft'
                  : m.dir === 'slight-right' ? 'slightRight'
                  : m.dir === 'lift' ? 'liftWord' : 'uTurn');
    var distToTurn = Math.max(0, m.s - s);
    /* 警告行只留俾「呢條路真係有樓梯」。
       以前呢度係出全 route 最斜一段，但（一）嗰個數字唔可信（見
       CONFIG.SLOPE_CLAMPED），（二）佢係路線整體嘅資料，屬於質素卡；
       置頂卡嘅職責係「下一個動作係咩」。樓梯唔同 —— 佢係即刻、
       喺你面前嘅危險，而且用戶可能已經捲離咗質素卡，所以一定要 pin 住。 */
    var stairsHere = route.stats.stairs + route.stats.escalator;
    renderTurn(m.dir, dirWord,
      distToTurn > 3 ? (Math.round(distToTurn) + ' ' + t('meters') + ' · ' + t('thenTurn'))
                     : t('thenTurn'),
      stairsHere > 0 ? t('wStairs') : '');
  } else {
    renderTurn('straight', t('straight'),
      Math.round(remain) + ' ' + t('meters'),
      (route.stats.stairs + route.stats.escalator) > 0 ? t('wStairs') : '');
  }
}

function renderArrived(route) {
  renderTurn('arrive', t('arrive'), t('arriveSub'), '');
  setText('prog-text', '0 ' + t('meters'));
  setText('prog-sub', '');
  document.getElementById('bar-fill').style.width = '100%';
}

var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'on';
  // 存起 handle —— 否則 3 秒內第二個 toast 會被第一個嘅 timer 截斷
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = ''; }, 4000);
}

/* ===== 12. 事件與啟動 ================================================== */

/* 規劃路線，順便處理「一定要搭呢條升降機」（見 PRESETS.A.via）。
 *
 * 兩段獨立 A* 再縫埋 —— 唔可以當佢係一個中途點：升降機邊嘅兩個落腳點
 * 平面距離只有 0.11 米，當中途點規劃＝同一個位置入同一個位置出，等於冇
 * 夾過（router 會若無其事咁行返原本嗰條路）。
 *
 * **唔可以 slice(1)。** 呢個 bug 真係踩過：寫 `p1.concat(p2.slice(1))` 係
 * 假設兩段共用接駁節點，但呢度 p1 尾（下層 12351）同 p2 頭（上層 10763）
 * 係兩個唔同節點，slice 會將升降機上層落腳點掉走，之後成條路線量出嚟
 * 「升降機 0 次」，而 buildRoute 又會補一條 0 米假邊遮住個缺口 ——
 * 冇錯誤、只有錯數字。 */
function planVia(s, g, via) {
  if (!via) return null;
  var ei = edgeBetween(via.lo, via.hi);
  var e = (ei >= 0) ? GRAPH.edges[ei] : null;
  /* 一定要驗證真係升降機邊。數據一旦改動、或有人改錯節點編號，
     就會靜靜咁變成「搭咗一部唔存在嘅𨋢」—— 呢個 App 唔可以出呢種錯。 */
  if (!e || !(e[4] & F.LIFT)) return null;
  var p1 = astar(s, via.lo, false, false);
  var p2 = astar(via.hi, g, false, false);
  if (!p1 || !p2) return null;
  return p1.concat(p2);
}

/* 回傳 { path, via }。via=false 代表「照舊行普通最短路」，唔係錯誤。 */
function planPath(s, g, key) {
  var via = PRESETS[key] ? PRESETS[key].via : null;
  var p = planVia(s, g, via);
  if (p) return { path: p, via: true };
  return { path: astar(s, g, false, false), via: false };
}

/* 中途重新規劃之後要返去邊 —— startRoute() 用完即清。
 *
 * null 代表「由頭開始」（用戶揀路線）；有值代表「呢次係轉語言／轉天氣／
 * 其他原地重算」。以前轉語言同轉天氣都係直入 beginAfterIntro()，即係
 * 位置返 0、播放停低、開場白由頭再講 —— 用戶撳一下，成程路就冇咗。 */
var resumeAfterReplan = null;

/* 將「已經行過」嘅提示標記為講過。
 *
 * 重新規劃會整個換新 route 物件，新物件嘅 announced 旗標全部係 false。
 * 如果就咁繼續行，觸發器會將身後嘅嘢一次過補播：
 *   - 旁述軌 `s >= c.s - 15` 冇上界 → 身後所有 cue 會連續播出嚟
 *   - 地標軌 `s >= l.s` 亦冇上界 → 同樣
 * （設施軌有 `s <= f.s + 8` 上界，所以唔會補播，但一樣標記無害。）
 *
 * 一定要喺 walker.begin() **之後**叫：begin 會建立新嘅 S.walk，喺之前叫
 * 就會攞住舊嘅 s（或者 null）。
 *
 * 方向係單向由 false 變 true —— 呢啲旗標同時係「唔喺路徑上」嘅記錄，
 * 所以唔可以喺度由 true 變返 false。 */
function markPassedAsAnnounced(route, s) {
  if (!route) return;
  var i;
  var cues = route.cues || [];
  for (i = 0; i < cues.length; i++) { if (cues[i].s < s) cues[i].announced = true; }
  var lms = route.landmarks || [];
  for (i = 0; i < lms.length; i++) { if (lms[i].s < s) lms[i].announced = true; }
  var facs = route.facilities || [];
  for (i = 0; i < facs.length; i++) { if (facs[i].s < s) facs[i].announced = true; }
}

function startRoute(key) {
  if (!GRAPH) { showToast(t('dataFail')); return; }
  S.routeKey = key;
  var resume = resumeAfterReplan;
  resumeAfterReplan = null;
  // S.blocked / S.reports 唔喺呢度清。
  // 用戶報告過「呢度唔通」就係一個事實，唔會因為佢轉語言或者轉天氣而消失。
  // 只有「重新開始」才清（見 btn-reset）。
  narratorCancel();

  /* 天氣權重一定要喺 astar() **之前** 設好。
     edgeCost() 讀 S.rain，所以放喺計路之後就等於冇改過 ——
     呢個正係原本「雨天路線其實用晴天權重」嘅成因。
     但用戶手動撳過天氣掣就永遠以用戶為準：唔可以行到一半自己轉返。 */
  if (!S.weatherManual) setRain(PRESETS[key].rain, S.weatherSource || 'preset');

  var toKey = PRESETS[key].to;
  var s = nearestNode(POIS[ORIGIN].lng, POIS[ORIGIN].lat).idx;
  var g = nearestNode(POIS[toKey].lng, POIS[toKey].lat).idx;

  var plan = planPath(s, g, key);
  var path = plan.path;
  var relaxed = false;
  if (!path) {
    // 硬排除下冇路 —— 放寬並明確告知（放寬嗰條唔夾 via：有路要緊）
    path = astar(s, g, false, true);
    relaxed = true;
  }
  if (!path) { showToast(t('noRoute')); return; }

  S.route = buildRoute(path, key);
  S.route.relaxed = relaxed;
  /* 記錄「有冇搭到指定嗰部𨋢」。planVia 失敗會靜靜咁退回普通 A*，
     呢個旗標就係分辨兩者嘅唯一方法（質素卡唔會攞嚟講，但測試同
     將來嘅除錯要靠佢）。 */
  S.route.viaLift = plan.via;

  document.getElementById('route-A').setAttribute('aria-pressed', String(key === 'A'));
  document.getElementById('route-B').setAttribute('aria-pressed', String(key === 'B'));

  renderQuality(S.route);
  drawRoute(S.route);
  updateProgress(S.route, 0);

  /* 有咗路線，有蓋標記嘅「同一組只畫一個」就可以揀最近用戶嗰個
     （見 coveredDrawSet）。呢個係唯一一次重畫，唔會隨住行路跳嚟跳去。 */
  rebuildFacilityMarkers();

  document.getElementById('btn-play').disabled = false;
  document.getElementById('btn-block').disabled = false;

  var speed = (key === 'A') ? CONFIG.WHEEL_SPEED : CONFIG.ELDER_SPEED;

  /* 原地重算（轉語言／轉天氣）—— 保位置、保播放狀態，唔講開場白。
     開場白係「你將由 A 行到 B，全程 X 米」，行到一半再講係錯嘅，
     而且 beginAfterIntro() 會停低等佢講完，個點會無啦啦 freeze 幾秒。 */
  if (resume) {
    walker.begin(S.route, speed);          // begin 內部已經 run（playing = true）
    S.walk.s = Math.min(resume.s, S.route.total);
    markPassedAsAnnounced(S.route, S.walk.s);
    updateProgress(S.route, S.walk.s);
    if (!resume.playing) walker.pause();
    setPlayButton();                       // 標籤由 S.walk 狀態推導，唔靠參數
    /* 只有路線真係變咗（轉天氣）才值得講一句。轉語言幾何一樣，講
       「已重新規劃」係講多咗 —— 下一句提示自然會用新語言講。 */
    if (resume.note) narratorSay(t('nReplanned'), 3, 'replan');
    if (relaxed) showToast(t('wStairs'));
    return;
  }

  /* 先講開場白，講完（或等夠上限）才起步 —— 見 beginAfterIntro。
     順序一定要係「先講、後排隊起步」：narratorSay 會同步設 narrator.busy，
     beginAfterIntro 嘅輪詢就係靠呢個 flag 判斷講完未。

     按路線長短調整（用戶要求）：短線唔需要聽「約 X 分鐘」，開場白越長越
     容易同第一個轉向提示撞。長短兩句都保留「慢慢嚟」嘅關心。 */
  var intro = (S.route.total < CONFIG.SHORT_ROUTE_M)
    ? fmt(t('nStartShort'), { d: Math.round(S.route.total) })
    : fmt(t('nStart'), { d: Math.round(S.route.total), t: estMinutes(S.route) });
  narratorSay(intro, 3, 'start');
  beginAfterIntro(S.route, speed);

  if (relaxed) showToast(t('wStairs'));
}

/* 開場白講完先起步。
 *
 * 用戶報「開始全程多少米還沒説完就被下一句話打斷」。轉向提示一句都不能
 * 刪，所以呢度用「等」而唔係用「刪」嚟解決衝突：路線 A 得 639 米／約 11
 * 分鐘，等幾秒零成本，但可以直接消除症狀。
 *
 * 一定要有上限 —— 就算語音壞咗完全冇 onend，最多等 INTRO_WAIT_MAX_MS
 * 都要起步，唔可以因為語音而令導航完全唔行。
 * 用遞迴 setTimeout 而唔用 setInterval：harness 只 stub 咗 setTimeout。 */
function beginAfterIntro(route, speed) {
  walker.begin(route, speed);
  walker.pause();                    // playing = false，等開場白
  var w = S.walk;
  w.introHold = true;
  setPlayButton(false);

  var waited = 0;
  function waitIntro() {
    waited += 120;
    if (waited < CONFIG.INTRO_WAIT_MAX_MS && narrator.busy) {
      setTimeout(waitIntro, 120);
      return;
    }
    w.introHold = false;
    // 用戶可能已經轉咗路線或者撳咗暫停，兩者都唔應該被呢度強行起步
    if (S.walk === w && !w.arrived && !w.playing) walker.resume();
  }
  setTimeout(waitIntro, 120);
}

function togglePlay() {
  if (!S.walk) return;
  if (S.walk.arrived) { startRoute(S.routeKey); return; }
  if (S.walk.introHold) {
    // 用戶自己撳掣，就唔再等開場白 —— 主導權喺用戶手上
    S.walk.introHold = false;
    walker.resume();
    setPlayButton(false);
    return;
  }
  if (S.walk.playing) {
    walker.pause();
    setPlayButton(true);
    /* 語音都要一齊停 —— 「暫停」對用戶嚟講就係「而家唔想聽到嘢」，
       淨係凍結個點而任由旁白講落去，係掣壞咗嘅感覺。
       只有真係有句講緊（narrator.busy）才設 suspended：
       冇句子就冇嘢好停，亦唔應該無謂咁將 speechSynthesis 設成 paused。 */
    if (narrator.busy) {
      narrator.suspended = true;
      pauseSpeech();
    }
  } else {
    walker.resume();
    setPlayButton(false);
    if (narrator.suspended) {
      narrator.suspended = false;
      resumeSpeech();
      /* 暫停期間句子有可能自己播完（onend 照樣會嚟到，finish() 見到
         suspended 就唔補播下一句）。所以恢復嗰陣要自己補返一次，
         否則嗰句被搶佔嘅提示就永遠消失。 */
      narratorDrain();
    }
  }
}

/* 「速度」掣：1 → 2 → 4 → 1（見 CONFIG.SPEED_STEPS）。
 *
 * 只改「兩句旁白之間行幾快」：講緊嘢嘅時候減速總督照樣接手（見 §10），
 * 所以語音永遠跟得上，唔會出現「4 倍速就聽唔到提示」。亦唔會重新規劃
 * 路線、唔會改語音長度。 */
function cycleSpeed() {
  var steps = CONFIG.SPEED_STEPS;
  var i = steps.indexOf(S.speedMul);
  if (i < 0) i = -1;                       // 值唔喺清單（例如舊 localStorage）→ 返常速
  S.speedMul = steps[(i + 1) % steps.length];
  updateSpeedButton();
}

var SPEED_ICON =
  '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">' +
  '<path d="M3 6.2v11.6l8.4-5.8z"/><path d="M12.6 6.2v11.6L21 12z"/></svg>';

/* 掣面文字同 aria-label 都出倍數 —— 淨係寫「1×」對長者用戶唔清楚，
   而低視力用戶要用放大鏡睇，所以「速度」兩個字一定要喺掣面。 */
function updateSpeedButton() {
  var b = document.getElementById('btn-speed');
  if (!b) return;
  var n = S.speedMul || 1;
  b.innerHTML = SPEED_ICON + '<span id="btn-speed-text">' + t('speed') + ' ' + n + '×</span>';
  b.setAttribute('aria-label', fmt(t('speedAria'), { n: n }));
}

/* 「報告此路不通」。
 *
 * 用戶選咗「落標記 ＋ 自動改道 ＋ 面板報告清單」。三樣都要做齊：
 *   1. 喺報告位置落一個**持久**標記（紅色菱形 ＋ 白色「!」）——
 *      形狀同圓／三角／方都唔同，配合顏色雙重編碼。標記唔會因為改道而消失，
 *      佢係一個事實陳述。aria-hidden：236 個裝飾標記已經唔讀，唔可以加一個
 *      要讀嘅落去；內容經面板清單同語音傳達。
 *   2. 記錄落 S.reports（位置、沿線距離、時間），面板列清單。
 *   3. 保留原本嘅自動改道 —— 用戶明確揀咗要自動重算。
 */
var REPORT_ICON =
  '<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 32 32">' +
  '<path d="M16 2.5L29.5 16 16 29.5 2.5 16z" fill="#B71C1C" stroke="#fff" stroke-width="3"/>' +
  '<path d="M16 9.5v8.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>' +
  '<circle cx="16" cy="23" r="2.1" fill="#fff"/></svg>';

var REPORT_MARKERS = [];

function addReportMarker(lng, lat) {
  if (!MAP || !window.mapboxgl) return;
  var el = document.createElement('div');
  el.setAttribute('aria-hidden', 'true');
  el.style.cssText = 'width:44px;height:44px;';
  el.innerHTML = REPORT_ICON;
  var mk = new mapboxgl.Marker({ element: el, anchor: 'center' })
    .setLngLat([lng, lat]).addTo(MAP);
  REPORT_MARKERS.push(mk);
}

function clearReportMarkers() {
  for (var i = 0; i < REPORT_MARKERS.length; i++) {
    if (REPORT_MARKERS[i] && REPORT_MARKERS[i].remove) REPORT_MARKERS[i].remove();
  }
  REPORT_MARKERS = [];
}

function nowHM() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

function renderReports() {
  var card = document.getElementById('report-card');
  var list = document.getElementById('report-list');
  if (!card || !list) return;
  if (!S.reports.length) {
    card.hidden = true;
    setText('report-title', '');
    return;
  }
  card.hidden = false;
  setText('report-title', fmt(t('reportTitle'), { n: S.reports.length }));

  // 清空再重建（語言切換時要跟住轉）
  while (list.firstChild) list.removeChild(list.firstChild);
  for (var i = 0; i < S.reports.length; i++) {
    var r = S.reports[i];
    var li = document.createElement('li');
    li.innerHTML = REPORT_ICON;         // 固定字串，唔含任何資料
    var sp = document.createElement('span');
    sp.textContent = fmt(t('reportItem'), { m: Math.round(r.s), time: r.time });
    li.appendChild(sp);
    list.appendChild(li);
  }
}

function reportBlocked() {
  if (!S.route || !S.walk) return;
  var at = Math.min(S.route.total, S.walk.s + 25);   // 前面約 25m
  var p = walker.pointAt(S.route, at);
  var n = nearestNode(p[0], p[1]);
  var list = ADJ[n.idx] || [];
  var added = 0;
  for (var i = 0; i < list.length && added < 3; i++) {
    var e = GRAPH.edges[list[i]];
    S.blocked.push([e[0], e[1]]);
    added++;
  }

  S.reports.push({ lng: p[0], lat: p[1], s: at, time: nowHM() });
  addReportMarker(p[0], p[1]);
  renderReports();

  var keep = S.walk.s;
  var toKey = PRESETS[S.routeKey].to;
  var g = nearestNode(POIS[toKey].lng, POIS[toKey].lat).idx;
  var from = nearestNode(walker.pointAt(S.route, keep)[0],
                         walker.pointAt(S.route, keep)[1]).idx;

  var path = astar(from, g, false, false) || astar(from, g, false, true);
  if (!path) { showToast(t('noRoute')); return; }
  /* 呢度**唔夾** PRESETS 嘅 via：改道係由目前位置出發，硬要繞去搭嗰部𨋢
     可能要多行幾百米先返到嚟，甚至根本冇路。改道嘅目標係「避開障礙」，
     唔係「維持示範效果」—— 所以照行普通最短路。 */

  walker.pause();
  S.route = buildRoute(path, S.routeKey);
  // 新路徑由「目前位置」開始，所以 s 由 0 起係正確嘅
  renderQuality(S.route);
  drawRoute(S.route);
  rebuildFacilityMarkers();   // 改咗路，有蓋標記嘅代表點跟住換（見 coveredDrawSet）
  walker.begin(S.route, S.routeKey === 'A' ? CONFIG.WHEEL_SPEED : CONFIG.ELDER_SPEED);
  setPlayButton(false);
  /* 換咗路線，舊路線嗰句旁白就唔再成立 —— 但單槽旁白器唔知，佢只會睇
     優先級。如果嗰刻正講緊一句同等級（3）嘅轉向提示，下面嘅 nReport
     會因為 `priority <= narrator.priority` 而被丟入 retry，用戶就聽唔到
     「已記錄」。所以喺呢度明確取消：換路線係旁白器嘅決定，同 §8 嗰條
     「speak() 唔可以自己 cancel」係同一個原則嘅兩面。 */
  narratorCancel();
  // 一句講齊「記低咗」同「幫你避開」——唔好拆兩句同等優先級，
  // 單槽旁白器會丟棄第二句（同等優先級唔會搶）。
  narratorSay(t('nReport'), 3, 'report');
  showToast(t('blockedDone'));
}

function setLang(lang) {
  if (S.lang === lang) return;
  S.lang = lang;
  try { localStorage.setItem('a11y-lang', lang); } catch (e) {}
  applyI18n();

  // 語音可用性檢查 —— 唔可以靜靜轉語言（同 init 共用同一個函數，
  // 因為呢個警告以前只喺呢度出，而 init 從未叫過 setLang，即係預設路徑
  // 永遠唔會講「部機冇廣東話」。見 checkVoiceAvailability。）
  checkVoiceAvailability();

  if (S.route) {
    /* 重建路線以更新地標顯示名同左右。
       幾何完全一樣（語言唔入成本函數），所以一定要保住位置同播放狀態 ——
       以前係直接 startRoute()，即係撳一下語言掣就由起點重新行過、
       播放停低、開場白再講一次。 */
    captureResume(false);
    startRoute(S.routeKey);
  }
}

/* 即時天氣（Open-Meteo，免費、無 key、開放 CORS）。
 *
 * 用戶要求「天氣狀況根據當天情況自動調整」。三個約束：
 *   1. 用戶手動撳過天氣掣 → 永遠以用戶為準，唔覆寫（S.weatherManual）。
 *      已經揀咗路線都唔覆寫 —— 行到一半自己轉天氣比唔自動更差。
 *   2. **失敗要靜靜咁算**。離線、被防火牆擋、API 改版都係正常狀態，
 *      唔應該彈錯誤訊息嚇用家。預設晴天繼續行。
 *   3. 4 秒逾時。老人家唔會為咗「今日落唔落雨」等一個網絡請求。
 *
 * 沙盒（node harness）冇 fetch / AbortController，所以每個呼叫點都要守衛。
 */
var WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=22.3370&longitude=114.1760' +
             '&current=precipitation,rain,weather_code&timezone=Asia%2FHong_Kong';

function wxIsRainy(cur) {
  if (cur.precipitation > 0 || cur.rain > 0) return true;
  // WMO weather code：51–67 毛毛雨／雨，80–82 陣雨，95–99 雷暴
  var c = cur.weather_code;
  return (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || (c >= 95);
}

function fetchWeather() {
  if (S.weatherManual || S.route) return;
  if (typeof fetch !== 'function') return;

  var opts = {};
  var ctrl = null;
  if (typeof AbortController === 'function') {
    ctrl = new AbortController();
    opts.signal = ctrl.signal;
    setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 4000);
  }

  fetch(WX_URL, opts)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      // 期間用戶可能已經自己撳咗天氣掣或者揀咗路線 —— 兩者都唔可以覆寫
      if (S.weatherManual || S.route || !d || !d.current) return;
      setRain(wxIsRainy(d.current), 'auto');
    })
    .catch(function () { /* 靜靜咁算：離線係正常狀態 */ });
}

/* 記低目前位置，等 startRoute() 可以原地接返（見 resumeAfterReplan）。
 *
 * 只有「行到一半」才值得記 —— 未起步（s = 0）或者已經到達，由頭開始
 * 係正確嘅，記住反而會令到達咗嘅路線卡喺終點。
 *
 * note：路線真係變咗（轉天氣）就 true，出一句「已重新規劃」；
 * 幾何一樣（轉語言）就 false，唔好講多餘嘢。 */
function captureResume(note) {
  resumeAfterReplan = null;
  var w = S.walk;
  if (!w || w.arrived || !(w.s > 0)) return;
  resumeAfterReplan = { s: w.s, playing: !!w.playing, note: !!note };
}

function toggleWeather() {
  // 手動撳過之後永遠以用戶為準：preset 同自動偵測都唔再覆寫（見 startRoute）
  S.weatherManual = true;
  setRain(!S.rain, 'manual');
  if (S.route) {
    /* 天氣真係會改路線（B：晴 642 米／雨 653 米，仲多一部𨋢），所以呢次
       要出一句聲；但位置同播放狀態照樣保留 —— 用戶撳天氣係想換路線，
       唔係想由頭行過。 */
    captureResume(true);
    startRoute(S.routeKey);
  }
}

/* 輪椅／推車開關。唔重新規劃路線（見 setWheel）—— 所以行緊都可以撳，
   唔會將行到一半嘅路程歸零。 */
function toggleWheel() {
  setWheel(!S.wheel);
}

function repeatLast() {
  if (!S.lastSpoken) { showToast(t('nRepeatNone')); return; }
  narratorCancel();
  narratorSay(S.lastSpoken, 3, 'repeat');
}

function init() {
  if (!initGraph()) {
    showToast(t('dataFail'));
    setText('instr-text', t('dataFail'));
    return;
  }
  try {
    var saved = localStorage.getItem('a11y-lang');
    if (saved === 'en' || saved === 'zh-HK') S.lang = saved;
  } catch (e) {}

  applyI18n();
  initMap();
  /* 「部機冇廣東話語音」要喺首屏就講。呢個檢查以前只喺 setLang() 入面，
     而 init() 由頭到尾冇叫過 setLang —— 即係預設載入路徑永遠唔會出。
     喺呢度叫一次，另外 voiceschanged 都會再叫（Chrome 第一次
     getVoices() 通常回空陣列）。 */
  checkVoiceAvailability();
  fetchWeather();          // 非阻塞、失敗即靜靜咁算（見 fetchWeather）

  document.getElementById('lang-zh').addEventListener('click', function () { setLang('zh-HK'); });
  document.getElementById('lang-en').addEventListener('click', function () { setLang('en'); });
  document.getElementById('route-A').addEventListener('click', function () { startRoute('A'); });
  document.getElementById('route-B').addEventListener('click', function () { startRoute('B'); });
  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-repeat').addEventListener('click', repeatLast);
  document.getElementById('btn-weather').addEventListener('click', toggleWeather);
  document.getElementById('btn-wheel').addEventListener('click', toggleWheel);
  document.getElementById('btn-speed').addEventListener('click', cycleSpeed);
  // 首屏：圖例同開關都要有正確狀態（唔可以等用戶撳一下先同步）
  renderLegend();
  updateWheelButton();
  updateModeNote();
  document.getElementById('btn-block').addEventListener('click', reportBlocked);
  document.getElementById('btn-reset').addEventListener('click', function () {
    narratorCancel();
    if (S.walk && S.walk.timer) clearTimeout(S.walk.timer);
    S.walk = null; S.route = null; S.routeKey = null;
    // 只有「重新開始」才清空報告 —— 報告係用戶講過嘅事實
    S.blocked = []; S.reports = [];
    clearReportMarkers();
    renderReports();
    document.getElementById('quality').hidden = true;
    document.getElementById('btn-play').disabled = true;
    document.getElementById('btn-block').disabled = true;
    document.getElementById('route-A').setAttribute('aria-pressed', 'false');
    document.getElementById('route-B').setAttribute('aria-pressed', 'false');
    setPlayButton(true);
    renderTurn('straight', t('readyStart'), t('pickRoute'), '');
    setText('prog-text', '–'); setText('prog-sub', '');
    document.getElementById('bar-fill').style.width = '0%';
  });
}

/* 地圖高度而家跟視窗（clamp + 100dvh），所以視窗一變就要叫 Mapbox 重新度位。
   以前完全冇 resize 監聽：地圖高度一樣會隨視窗變，但 Mapbox 快取咗尺寸，
   於是 canvas 同容器對唔上。手機工具列收放亦會觸發呢個。 */
if (window.addEventListener) {
  var _rzTimer = null;
  window.addEventListener('resize', function () {
    if (_rzTimer) clearTimeout(_rzTimer);
    _rzTimer = setTimeout(function () {
      _rzTimer = null;
      if (MAP && typeof MAP.resize === 'function') {
        try { MAP.resize(); } catch (e) {}
      }
    }, 150);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>

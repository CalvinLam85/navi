<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>無障礙出行助手 · Accessibility Travel Assistant</title>
<meta name="description" content="為長者及輪椅使用者而設的九龍塘無障礙步行導航">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
<style>
/* ============================================================
   設計代幣 —— 全部以「長者優先」為前提
   對比 AAA ≥7:1 · 正文 ≥24px · 觸控 ≥60px · 主要按鈕 80px
   ============================================================ */
:root{
  --color-primary:#1A237E;
  --color-primary-soft:#E8EAF6;
  --color-bg:#FFF8F0;
  --color-surface:#FFFFFF;
  --color-ink:#1A1A1A;
  --color-ink-soft:#3E3E3E;
  --color-muted:#5A5A5A;
  --color-border:#8A8A8A;
  --color-lift:#0D47A1;
  --color-ramp:#2E7D32;
  --color-covered:#E65100;
  --color-covered-glow:rgba(230,81,0,.45);
  --color-escalator:#6A1B9A;
  --color-warn:#B71C1C;
  --color-warn-bg:#FFEBEE;
  --color-ok:#1B5E20;
  --color-ok-bg:#E8F5E9;
  /* 焦點環顏色。原本係 #FF6D00，對五個底色全部唔夠 3:1（bg 2.68 · 白 2.82 ·
     primary-soft 2.36 · warn-bg 2.47 · ok-bg 2.51），即係鍵盤使用者根本睇唔到
     個環。WCAG 2.4.11 要求焦點指示對相鄰顏色 ≥3:1。下面呢個值係逐個底色計出嚟
     嘅：最低 4.34:1（primary-soft），其餘 4.55–5.20:1。改顏色之前請重新計，
     唔好靠肉眼。 */
  --color-focus:#C43E00;

  /* 字級：冇任何一級低於 24px */
  --fs-turn:36px;
  --fs-metric:30px;
  --fs-btn:28px;
  --fs-body:26px;
  --fs-small:24px;

  --tap:60px;
  --tap-primary:80px;

  --radius:16px;
  --radius-sm:10px;
  --shadow:0 3px 14px rgba(0,0,0,.18);
  --gap:14px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--color-bg);
  color:var(--color-ink);
  font-family:Nunito,'PingFang HK','Microsoft JhengHei','Noto Sans TC',sans-serif;
  font-size:var(--fs-body);
  line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:600px;margin:0 auto;padding:0 14px 120px}

/* 跳至主要內容 —— 鍵盤使用者第一個 Tab 就到 */
.skip{
  position:absolute;left:-9999px;top:0;z-index:100;
  background:var(--color-primary);color:#fff;padding:14px 20px;
  font-size:var(--fs-btn);border-radius:0 0 var(--radius-sm) 0;
}
.skip:focus{left:0}

/* 焦點環 —— 4px，全站一致 */
:focus-visible{
  outline:4px solid var(--color-focus);
  outline-offset:3px;
  border-radius:var(--radius-sm);
}

h1{
  font-size:var(--fs-body);font-weight:800;
  margin:14px 0 6px;color:var(--color-primary);
  display:flex;align-items:center;gap:10px;
}
h1 svg{flex:none}

/* ---------- 語言切換 ---------- */
.langbar{display:flex;gap:10px;justify-content:flex-end;margin-bottom:8px}
.lang-btn{
  display:flex;align-items:center;gap:8px;
  min-height:var(--tap);padding:8px 18px;
  font-size:var(--fs-small);font-weight:700;font-family:inherit;
  color:var(--color-primary);background:var(--color-surface);
  border:3px solid var(--color-primary);border-radius:999px;cursor:pointer;
}
.lang-btn[aria-pressed="true"]{background:var(--color-primary);color:#fff}
.lang-btn svg{flex:none}

/* ---------- 大指令卡 ---------- */
.card{
  background:var(--color-surface);
  border:3px solid var(--color-primary);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  margin-bottom:var(--gap);
}
#instruction{
  display:flex;align-items:center;gap:16px;
  background:var(--color-primary);color:#fff;border-color:var(--color-primary);
}
#turn-arrow{
  flex:none;width:76px;height:76px;
  transition:transform .25s ease;
}
#instr-text{font-size:var(--fs-turn);font-weight:800;line-height:1.2}
#instr-sub{font-size:var(--fs-small);font-weight:600;opacity:.95;margin-top:4px}
#instr-warn{
  margin-top:10px;font-size:var(--fs-small);font-weight:700;
  background:#fff;color:var(--color-warn);
  border:3px solid var(--color-warn);border-radius:var(--radius-sm);
  padding:8px 12px;display:none;
}
#instr-warn.on{display:block}

/* ---------- 置頂區（指令卡 ＋ 地圖一齊 pin） ----------
   注意：祖先一旦有 overflow:hidden 就會令 sticky 失效。.wrap 同 body
   都冇設 overflow，所以呢度行得通。 */
.hero{
  position:sticky;top:0;z-index:15;
  background:var(--color-bg);
  padding:10px 0 var(--gap);
  /* 收窄嘅陰影，令下面嘅內容滾過嗰時睇得出係「壓住」 */
  box-shadow:0 8px 14px -10px rgba(26,35,126,.55);
}

/* ---------- 地圖 ---------- */
/* 地圖高度 = 「視窗高度減去固定開支」，唔係一個固定 vh 百分比。
 *
 * hero 係置頂嘅，佢有幾高直接決定下面仲剩幾多位俾路線卡／質素卡／控制面板捲。
 * 之前用 `38vh` + `max-height`：喺 1422×1104 只出到 380px，佔螢幕 34%，
 * 用戶兩次話「佔比太小」。改用 clamp 之後地圖會自己食晒剩低嘅空間 ——
 * 同一個視窗出 560px（51%）。
 *
 * `100vh − 430px` 嗰 430 係實測出嚟嘅固定開支：指令卡連 padding 約 158px
 * （≥24px 字級下限令佢冇得再矮），加約 270px 內容帶（要見到路線卡同質素卡
 * 嘅頭幾行）。1vh/1dvh 兩行係漸進增強：手機工具列會令 100vh 高過實際可視
 * 高度，支援 dvh 嘅瀏覽器用第二行。 */
#map{
  height:clamp(240px, calc(100vh - 430px), 560px);
  height:clamp(240px, calc(100dvh - 430px), 560px);
  width:100%;
  border:3px solid var(--color-primary);border-radius:var(--radius);
  background:#DDE3EA;
  /* Mapbox 自己會補 position:relative，但地圖載入失敗時就冇人補 ——
     而 .map-fallback 係 absolute，冇 relative 就會飛出容器。 */
  position:relative;
}
/* 矮視窗：hero 佔細啲，否則 hero ＋ 底部面板會高過視口，中間嘅卡片完全睇唔到。
   呢條線以下「面板完整入到 hero 以下」根本冇可能成立（608 高：386+463 > 608），
   所以呢度只求 hero 唔好霸晒。預留額由 430 收到 380，即係矮窗都分多 50px 俾地圖。 */
@media (max-height:720px){
  #map{
    height:clamp(170px, calc(100vh - 380px), 300px);
    height:clamp(170px, calc(100dvh - 380px), 300px);
  }
}
/* 地圖失敗時嘅替代內容。唔可以淨係一個灰色空盒：使用者會以為成個 app 都死咗。
   呢度講清楚「路線同語音照常」，並且維持 ≥24px 字級同 AAA 對比。 */
.map-fallback{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:20px;text-align:center;
  background:var(--color-bg);
}
.map-fallback-title{font-size:var(--fs-metric);font-weight:800;color:var(--color-primary)}
.map-fallback-body{
  font-size:var(--fs-small);font-weight:700;color:var(--color-ink);
  max-width:24em;
}

.mapboxgl-ctrl-group button{
  width:var(--tap) !important;height:var(--tap) !important;
}
.mapboxgl-ctrl-group button span{transform:scale(1.5)}

/* ---------- Mapbox 內建 UI 一樣要守住設計下限 ----------
 * 上面嗰條只覆蓋 .mapboxgl-ctrl-group（縮放／指南針）。attribution 係另一個
 * 獨立控件，Mapbox 預設係 12px 字同 24px 掣 —— 兩者都低過本項目嘅硬性下限
 * （字 ≥24px、觸控 ≥60px）。第三方來源唔係豁免理由：用呢個 app 嘅人一樣要
 * 睇得到、篤得中。
 * 容器永遠 ≤640px，所以 Mapbox 一定用 compact 模式（淨係一個 ⓘ 掣），下面
 * 兩種狀態都寫齊，唔靠估邊個 class 會出現。 */
#map .mapboxgl-ctrl-attrib a,
#map .mapboxgl-ctrl-attrib{
  font-size:var(--fs-small) !important;
  line-height:1.35 !important;
}
#map .mapboxgl-ctrl-attrib.mapboxgl-compact{
  min-height:var(--tap) !important;
  border-radius:var(--radius-sm) !important;
}
#map .mapboxgl-ctrl-attrib-button{
  width:var(--tap) !important;height:var(--tap) !important;
  background-size:36px 36px !important;
  background-position:center !important;
  background-repeat:no-repeat !important;
}
/* 展開之後係使用者自己撳嘅，暫時蓋住地圖可以接受；但唔可以長過呢個上限，
   否則細視窗下會成幅地圖消失。超出就捲。 */
#map .mapboxgl-ctrl-attrib.mapboxgl-compact .mapboxgl-ctrl-attrib-inner{
  max-height:240px;overflow:auto;
  padding:10px 12px !important;
}
@media (max-height:720px){
  #map .mapboxgl-ctrl-attrib.mapboxgl-compact .mapboxgl-ctrl-attrib-inner{
    max-height:150px;
  }
}

/* 設施標記嘅 60px 點擊區。圖形本身維持 40px（任何模式都一樣），
   但觸控目標要 ≥60px —— 長者手指唔可能篤中 40px 嘅圓形。 */
.fac-hit{
  width:60px;height:60px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
/* 彈出框：同站內字體一致，≥24px，顏色用 AA/AAA 對比 */
.fac-pop{
  display:flex;flex-direction:column;gap:2px;
  font-family:Nunito,'PingFang HK','Microsoft JhengHei','Noto Sans TC',sans-serif;
  font-size:var(--fs-small);line-height:1.35;color:var(--color-ink);
}
.fac-pop strong{font-size:var(--fs-body);font-weight:800;color:var(--color-primary)}
.mapboxgl-popup-content{border-radius:var(--radius-sm) !important;padding:12px 14px !important}
.mapboxgl-popup-close-button{font-size:30px !important;width:44px !important;height:44px !important;color:var(--color-ink)}

/* ---------- 已報告障礙清單 ---------- */
.report-list{margin:0;padding:0;list-style:none}
.report-list li{
  display:flex;align-items:center;gap:12px;
  font-size:var(--fs-small);font-weight:700;
  padding:10px 0;border-top:2px solid var(--color-primary-soft);
}
.report-list li:first-child{border-top:0}
.report-list svg{flex:none;width:34px;height:34px}

/* ---------- 底部控制面板 ----------
 *
 * 呢個本來叫 .sticky 而且係 `position:sticky;bottom:0`。加咗置頂 hero 之後
 * 就唔可以留：實測面板本身高 460–520px（5 個 ≥80px 嘅掣排成 3 行已經 240px，
 * 加進度條同圖例），hero 高 340–580px，兩個一齊 pin 就係 800–1100px。
 * 1440×1200 實測仍然重疊 175px，中間嘅路線質素卡同報告清單被夾到完全摸唔到
 * —— 而質素卡係「呢條路線到底可唔可靠」嘅唯一交代，唔可以遮。
 *
 * 取捨：用戶明確要求「地圖一直置頂」，所以保留 hero、放棄 pin 面板。
 * 面板本來就係頁面最後一嚿，捲到底就撳得到。亦唔可以靠縮掣去遷就 ——
 * 60/80px 觸控下限係硬規定。
 *
 * 順手改咗名做 .dock：一個叫 sticky 但唔 sticky 嘅 class 係陷阱。 */
.dock{
  position:relative;z-index:20;
  background:var(--color-bg);
  border-top:4px solid var(--color-primary);
  padding:12px 0 16px;margin:0 -14px;padding-left:14px;padding-right:14px;
}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#prog-text{font-size:var(--fs-current,30px);font-weight:800;color:var(--color-primary)}
.bar{
  height:20px;background:var(--color-primary-soft);
  border:2px solid var(--color-primary);border-radius:999px;
  overflow:hidden;margin-top:8px;
}
#bar-fill{height:100%;width:0;background:var(--color-primary);transition:width .3s ease}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:var(--tap-primary);
  font-family:inherit;font-size:var(--fs-btn);font-weight:800;
  color:#fff;background:var(--color-primary);
  border:3px solid var(--color-primary);border-radius:var(--radius);
  cursor:pointer;padding:8px;
}
.btn.secondary{background:var(--color-surface);color:var(--color-primary)}
.btn.danger{background:var(--color-warn);border-color:var(--color-warn)}
.btn[aria-pressed="true"]{background:#fff;color:var(--color-primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{flex:none}
.btn.full{grid-column:1 / -1}

/* ---------- 路線選擇 ---------- */
.route-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  width:100%;text-align:left;min-height:var(--tap-primary);
  padding:14px 16px;margin-bottom:10px;
  font-family:inherit;font-size:var(--fs-btn);font-weight:800;
  color:var(--color-primary);background:var(--color-surface);
  border:3px solid var(--color-primary);border-radius:var(--radius);cursor:pointer;
}
.route-btn .sub{font-size:var(--fs-small);font-weight:600;color:var(--color-ink-soft)}
.route-btn[aria-pressed="true"]{background:var(--color-primary);color:#fff}
.route-btn[aria-pressed="true"] .sub{color:#fff}

/* ---------- 路線品質卡 ---------- */
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q-item{
  background:var(--color-primary-soft);border-radius:var(--radius-sm);
  padding:10px 12px;
}
.q-label{font-size:var(--fs-small);font-weight:700;color:var(--color-ink-soft)}
.q-value{font-size:var(--fs-metric);font-weight:800;color:var(--color-primary)}
.q-bad{background:var(--color-warn-bg)}
.q-bad .q-value{color:var(--color-warn)}
.q-good{background:var(--color-ok-bg)}
.q-good .q-value{color:var(--color-ok)}
.q-note{font-size:var(--fs-small);font-weight:600;margin-top:10px;color:var(--color-ink-soft)}

/* ---------- 圖例 ---------- */
.legend{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:6px}
.legend-item{display:flex;align-items:center;gap:10px;font-size:var(--fs-small);font-weight:700}
.legend-item svg{flex:none;width:32px;height:32px;display:block}
.lg-icon{display:flex;align-items:center}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:24px;z-index:90;
  max-width:560px;width:calc(100% - 32px);
  background:var(--color-warn);color:#fff;
  font-size:var(--fs-small);font-weight:700;
  padding:16px 20px;border-radius:var(--radius);
  box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
#toast.on{opacity:1}

/* ---------- 資料來源 ---------- */
.credits{font-size:var(--fs-small);color:var(--color-muted);margin-top:10px;line-height:1.5}
.credits a{color:var(--color-primary);font-weight:700}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

@media (max-width:400px){
  :root{--fs-turn:32px;--fs-btn:26px;--fs-body:24px}
  #turn-arrow{width:64px;height:64px}
}

/* 減少動態 —— 尊重系統設定 */
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<a class="skip" href="#panel">跳至控制面板</a>

<div class="wrap">

  <div class="langbar">
    <button class="lang-btn" id="lang-zh" type="button" aria-pressed="true">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>
      廣東話
    </button>
    <button class="lang-btn" id="lang-en" type="button" aria-pressed="false">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>
      English
    </button>
  </div>

  <h1>
    <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="4" r="2.2"/><path d="M12 6.5v6.5M12 13h5.5l3 6M12 13H6.5l-3 6M12 13l-3.5 7M12 13l3.5 7"/></svg>
    <span id="app-title">無障礙出行助手</span>
  </h1>

  <!-- ===== 置頂區：指令卡 ＋ 地圖 =====
       用戶要求「地圖一直置頂，往下滑都睇得到」。指令卡一定要一齊 pin ——
       只 pin 地圖就會遮住「一眼要睇到」嘅指令卡，咁就本末倒置。 -->
  <div class="hero">
    <div class="card" id="instruction">
      <svg id="turn-arrow" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 42V14"/><path d="M13 25L24 14l11 11"/>
      </svg>
      <div>
        <div id="instr-text">準備開始</div>
        <div id="instr-sub">請先揀一條路線</div>
        <div id="instr-warn"></div>
      </div>
    </div>

    <!-- 地圖載入失敗時嘅替代內容。
         關鍵事實：路線規劃、設施、旁述全部係本機資料（data/*.js），冇一樣靠
         Mapbox。所以地圖死咗，導航照樣行得通 —— 訊息一定要講明呢點，
         唔好令使用者以為成個 app 都壞咗，然後放棄。 -->
    <div id="map" role="img" aria-label="九龍塘無障礙路線地圖">
      <div id="map-fallback" class="map-fallback" role="status" hidden>
        <svg width="72" height="72" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <path d="M4 11 L17 6 L31 11 L44 6 V37 L31 42 L17 37 L4 42 Z"
                fill="none" stroke="#1A237E" stroke-width="3" stroke-linejoin="round"/>
          <path d="M17 6 V37 M31 11 V42" fill="none" stroke="#1A237E" stroke-width="3"/>
          <path d="M8 40 L40 8" fill="none" stroke="#B71C1C" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <div class="map-fallback-title" id="map-fallback-title">地圖暫時載入唔到</div>
        <div class="map-fallback-body" id="map-fallback-body">路線規劃同語音導航照常運作，一樣可以用。</div>
      </div>
    </div>
  </div>

  <div id="panel">

    <!-- 路線選擇 -->
    <div class="card" id="routes-card">
      <div class="q-label" id="routes-label" style="margin-bottom:10px">揀目的地</div>
      <button class="route-btn" id="route-A" type="button" aria-pressed="false">
        <span id="route-A-name">輪椅路線 · 香港城市大學</span>
        <span class="sub" id="route-A-sub">避樓梯 · 平路優先</span>
      </button>
      <button class="route-btn" id="route-B" type="button" aria-pressed="false">
        <span id="route-B-name">晴雨路線 · 大坑東</span>
        <span class="sub" id="route-B-sub">晴天露天 · 落雨多蓋</span>
      </button>
    </div>

    <!-- 路線品質 -->

 */
function dataOrNull(name) {
  /* 一定要逐個名寫死。唔可以用 eval 砌字串：CSP 一禁 eval 就回 null，
     會誤報「資料載入失敗」，而且審查見到 eval 一定問。
     try/catch 係為咗萬一資料檔載入到一半拋錯，const 會留喺 TDZ，
     嗰陣連 typeof 都會拋 ReferenceError —— 應該當冇資料，唔係死喺度。 */
  try {
    if (name === 'KT_GRAPH')      return typeof KT_GRAPH      !== 'undefined' ? KT_GRAPH      : null;
    if (name === 'KT_FACILITIES') return typeof KT_FACILITIES !== 'undefined' ? KT_FACILITIES : null;
    if (name === 'KT_LANDMARKS')  return typeof KT_LANDMARKS  !== 'undefined' ? KT_LANDMARKS  : null;
    if (name === 'KT_POIS')       return typeof KT_POIS       !== 'undefined' ? KT_POIS       : null;
  } catch (e) { return null; }
  return null;
}

function initGraph() {
  GRAPH = dataOrNull('KT_GRAPH');
  if (!GRAPH || !GRAPH.nodes || !GRAPH.edges) return false;
  ADJ = {};
  for (var i = 0; i < GRAPH.edges.length; i++) {
    var e = GRAPH.edges[i];
    (ADJ[e[0]] = ADJ[e[0]] || []).push(i);
    (ADJ[e[1]] = ADJ[e[1]] || []).push(i);
  }
  return true;
}

function nearestNode(lng, lat) {
  var best = -1, bd = Infinity;
  for (var i = 0; i < GRAPH.nodes.length; i++) {
    var n = GRAPH.nodes[i];
    var d = metersBetween(lng, lat, n[0], n[1]);
    if (d < bd) { bd = d; best = i; }
  }
  return { idx: best, dist: bd };
}

/* 邊成本 —— 同 scripts/verify_routes.py 一致。
   penaltyOnly=true 時，原本硬排除嘅邊改成重罰（冇路時嘅退路）。 */
function edgeCost(e, penaltyOnly) {
  var len = e[2], slope = e[3], flags = e[4];

  if (flags & HARD_EXCLUDE) {
    if (!penaltyOnly) return Infinity;
  }
  var f;
  if (flags & F.LIFT) {
    f = COST.LIFT_K;                    // 升降機唔按坡度計算
  } else {
    if (slope > 0.005) f = 1 + COST.UPHILL_K * slope;
    else if (slope < -0.005) f = 1 + COST.DOWNHILL_K * Math.abs(slope);
    else f = 1;
    if (flags & F.STEEP) f *= COST.STEEP_K;
  }
  if (S.rain) f *= (flags & F.COVERED) ? COST.RAIN_COVERED : COST.RAIN_OPEN;
  if (penaltyOnly && (flags & HARD_EXCLUDE)) f *= COST.FALLBACK;
  return len * f;
}

function isBlockedNodePair(a, b) {
  for (var i = 0; i < S.blocked.length; i++) {
    var bl = S.blocked[i];
    if ((bl[0] === a && bl[1] === b) || (bl[0] === b && bl[1] === a)) return true;
  }
  return false;
}

/* 二元堆 */
function Heap() { this.a = []; }
Heap.prototype.push = function (p, v) {
  var a = this.a; a.push([p, v]);
  var i = a.length - 1;
  while (i > 0) {
    var par = (i - 1) >> 1;
    if (a[par][0] <= a[i][0]) break;
    var tmp = a[par]; a[par] = a[i]; a[i] = tmp; i = par;
  }
};
Heap.prototype.pop = function () {
  var a = this.a;
  if (!a.length) return null;
  var top = a[0], last = a.pop();
  if (a.length) {
    a[0] = last;
    var i = 0;
    for (;;) {
      var l = 2 * i + 1, r = l + 1, m = i;
      if (l < a.length && a[l][0] < a[m][0]) m = l;
      if (r < a.length && a[r][0] < a[m][0]) m = r;
      if (m === i) break;
      var tmp = a[m]; a[m] = a[i]; a[i] = tmp; i = m;
    }
  }
  return top;
};
Heap.prototype.empty = function () { return this.a.length === 0; };

/* shortest=true → 純距離（對照用）；penaltyOnly=true → 放寬硬排除 */
function astar(start, goal, shortest, penaltyOnly) {
  var N = GRAPH.nodes;
  function h(i) {
    return metersBetween(N[i][0], N[i][1], N[goal][0], N[goal][1]);
  }
  var g = {}, came = {}, closed = {};
  var pq = new Heap();
  g[start] = 0;
  pq.push(h(start), start);

  while (!pq.empty()) {
    var top = pq.pop();
    var cur = top[1];
    if (cur === goal) break;
    if (closed[cur]) continue;
    closed[cur] = 1;

    var list = ADJ[cur] || [];
    for (var k = 0; k < list.length; k++) {
      var ei = list[k], e = GRAPH.edges[ei];
      var nxt = (e[0] === cur) ? e[1] : e[0];
      if (isBlockedNodePair(cur, nxt)) continue;

      var cost = shortest ? e[2] : edgeCost(e, penaltyOnly);
      if (!isFinite(cost)) continue;

      var ng = g[cur] + cost;
      if (!(nxt in g) || ng < g[nxt]) {
        g[nxt] = ng; came[nxt] = cur;
        pq.push(ng + h(nxt), nxt);
      }
    }
  }
  if (!(goal in g)) return null;

  var path = [goal], c = goal;
  while (c !== start) { c = came[c]; if (c === undefined) return null; path.push(c); }
  return path.reverse();
}

/* ===== 5. 路線模型 ===================================================== */

function edgeBetween(a, b) {
  var list = ADJ[a] || [];
  for (var i = 0; i < list.length; i++) {
    var e = GRAPH.edges[list[i]];
    if ((e[0] === a && e[1] === b) || (e[0] === b && e[1] === a)) return list[i];
  }
  return -1;
}

function bearing(lng1, lat1, lng2, lat2) {
  var dx = (lng2 - lng1) * Math.cos(lat1 * Math.PI / 180);
  var dy = (lat2 - lat1);
  return Math.atan2(dx, dy) * 180 / Math.PI;   // 由北順時針
}

function normDeg(d) {
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}

function buildRoute(path, label) {
  var nodes = GRAPH.nodes, edges = GRAPH.edges;
  var pts = [], cum = [0], i, zs = [];

  for (i = 0; i < path.length; i++) {
    pts.push([nodes[path[i]][0], nodes[path[i]][1]]);
    zs.push(nodes[path[i]][2]);   // 設施配對要對高度（見 CONFIG.FAC_SAME_LEVEL_M）
  }

  var stats = {
    length: 0, stairs: 0, escalator: 0, lift: 0,
    coveredLen: 0, steepLen: 0, maxUp: 0, maxDown: 0
  };
  var edgeFlags = [], edgeLens = [];
  /* 路線會經過嘅升降機邊（s = 邊嘅起點）。行到呢度要停幾秒模擬搭𨋢，
     並且報一句「而家搭升降機」（見 §10 _tick 同 CONFIG.LIFT_HOLD_MS）。
     呢個係**通用**機制：唔理係邊條路線、邊部𨋢，只要有 LIFT 旗標就停。 */
  var lifts = [];

  for (i = 0; i < path.length - 1; i++) {
    var ei = edgeBetween(path[i], path[i + 1]);
    var e = (ei >= 0) ? edges[ei] : [0, 0, 0, 0, 0, 0];
    edgeFlags.push(e[4]); edgeLens.push(e[2]);
    stats.length += e[2];
    if (e[4] & F.STAIRS) stats.stairs++;
    if (e[4] & F.ESCALATOR) stats.escalator++;
    if (e[4] & F.LIFT) {
      stats.lift++;
      /* 方向由 Δz 嘅正負決定；樓層名唔喺數據度，係由 z 推導（見 CONFIG.MALL_LEVELS
         同 levelName()）—— 推唔到就照講「向上／向下」，唔會砌一個假樓層。
         zA / zB 兩邊都記低，因為落𨋢同入𨋢要講唔同嗰層。
         `done` 係「呢部𨋢已經處理過」，唔可以每次 tick 都再停一次。 */
      lifts.push({ s: cum[i], dz: nodes[path[i + 1]][2] - nodes[path[i]][2],
                   zA: nodes[path[i]][2], zB: nodes[path[i + 1]][2],
                   ei: ei, done: false });
    }
    if (e[4] & F.COVERED) stats.coveredLen += e[2];
    if (e[4] & F.STEEP) stats.steepLen += e[2];
    // 夾到上限嘅邊係垂直連接，唔係斜路 —— 唔可以計入「最大坡度」（見 CONFIG.SLOPE_CLAMPED）
    if (e[3] > 0.005 && e[3] < CONFIG.SLOPE_CLAMPED) stats.maxUp = Math.max(stats.maxUp, e[3]);
    else if (e[3] < -0.005 && e[3] > -CONFIG.SLOPE_CLAMPED) stats.maxDown = Math.max(stats.maxDown, -e[3]);
    cum.push(cum[i] + e[2]);
  }
  stats.coveredPct = stats.length > 0 ? 100 * stats.coveredLen / stats.length : 0;

  var maneuvers = extractManeuvers(pts, cum);

  // 沿線設施（垂直距離 < 22m）
  var rawFac = nearbyFacilities(pts, cum, zs, path, 22);
  var facilities = rawFac.map(function (f) {
    return { s: f.s, d: f.d, type: f.type, idx: f.idx, announced: false };
  });

  /* 升降機井喺 2D 上面係一個點 → 穿過井嘅路線一定會「行返轉頭」，
     extractManeuvers 就會抽出一個掉頭。實測路線 A 嗰個 153° 掉頭（s=211.1）
     就係夾出嚟嘅升降機邊（#13502，19.5 → 24.0 米），用戶報「語音同文字都話
     準備調頭，但其實係搭升降機」。呢一步將呢種掉頭改寫成 'lift'。 */
  markLiftManeuvers(maneuvers, lifts);

  /* 呢部𨋢由轉向軌（而家係「搭升降機」）由 60 米、20 米講到埋身，
     設施軌唔可以再講一次 —— 否則 41 米之內會出現四句「升降機」
     （實測：s=170 轉向軌、s=181 設施軌、s=191 轉向軌、s=211 埋身）。
     只剔走**路線真係搭嘅**嗰部；隔籬嘅𨋢照樣由設施軌講。 */
  for (i = 0; i < facilities.length; i++) {
    for (var lj = 0; lj < lifts.length; lj++) {
      if (lifts[lj].marked && Math.abs(facilities[i].s - lifts[lj].s) <= CONFIG.LIFT_MARK_M) {
        facilities[i].liftRidden = true;
        break;
      }
    }
  }

  // 升降機／斜道旁述：8–40 米，按索引同上面去重（唔可以同一設施講兩次）
  var cues = selectCues(pts, cum, zs, path, rawFac);

  // 沿線地標（政府 + OSM），做辨路提示
  var landmarks = selectLandmarks(pts, cum, maneuvers);

  return {
    label: label, path: path, pts: pts, cum: cum, zs: zs,
    edgeFlags: edgeFlags, edgeLens: edgeLens,
    stats: stats, maneuvers: maneuvers, lifts: lifts,
    facilities: facilities, cues: cues, landmarks: landmarks,
    total: stats.length,
    _coveredSaid: 0        // 有蓋通道最多播兩次（見 §6）
  };
}

/* 轉向抽取 —— 呢個係「轉向要準」嘅關鍵。
 *
 * 唔可以就咁用相鄰兩段嘅方位角：實測校園內部有大量 1–7 米嘅碎段，
 * 喺咁短嘅基線上算方位角，少少幾何誤差就會令角度大幅擺動，
 * 結果係憑空製造出大量假轉向（實測會產生 17 個「轉向」＝ 66 句語音，
 * 對於 639 米嘅路程嚟講係不停講嘢）。
 *
 * 做法：先將路線重採樣成固定 4 米間距，再用 ±12 米嘅基線計夾角。
 * 咁樣短碎段嘅噪音會被平滑掉，剩返真正嘅路口轉向。
 */
var RS_STEP = 4;        // 重採樣間距（米）
var RS_BASE = 3;        // 基線 = 3 步 ≈ 12 米
var TURN_MIN = 30;      // 夾角門檻（度）
var MERGE_WITHIN = 22;  // 相距少於此值嘅轉向合併為一個

function resample(pts, cum) {
  var out = [], i, j;
  for (i = 0; i < pts.length - 1; i++) {
    var segLen = cum[i + 1] - cum[i];
    var steps = Math.max(1, Math.round(segLen / RS_STEP));
    for (j = 0; j < steps; j++) {
      var u = j / steps;
      out.push({
        lng: pts[i][0] + u * (pts[i + 1][0] - pts[i][0]),
        lat: pts[i][1] + u * (pts[i + 1][1] - pts[i][1]),
        s: cum[i] + u * segLen
      });
    }
  }
  var last = pts.length - 1;
  out.push({ lng: pts[last][0], lat: pts[last][1], s: cum[last] });
  return out;
}

function extractManeuvers(pts, cum) {
  var rs = resample(pts, cum);
  var raw = [], k, i;

  for (i = RS_BASE; i < rs.length - RS_BASE; i++) {
    var a = rs[i - RS_BASE], b = rs[i], c = rs[i + RS_BASE];
    if (b.s - a.s < 4 || c.s - b.s < 4) continue;
    var bIn = bearing(a.lng, a.lat, b.lng, b.lat);
    var bOut = bearing(b.lng, b.lat, c.lng, c.lat);
    var turn = normDeg(bOut - bIn);
    if (Math.abs(turn) < TURN_MIN) continue;
    raw.push({ s: b.s, angle: turn });
  }

  // 合併鄰近轉向：同一個路口唔應該講兩次
  raw.sort(function (x, y) { return x.s - y.s; });
  var merged = [];
  for (k = 0; k < raw.length; k++) {
    var cur = raw[k];
    if (merged.length && (cur.s - merged[merged.length - 1].s) < MERGE_WITHIN) {
      var prev = merged[merged.length - 1];
      // 保留**角度較大**嘅一個，唔可以相加。
      // 相加會令兩個連續 80° 轉彎變成 160°，被誤判成「掉頭」——
      // 實測起點就出現咗一次假掉頭提示。
      if (Math.abs(cur.angle) > Math.abs(prev.angle)) {
        prev.angle = cur.angle;
        prev.s = cur.s;
      }
      continue;
    }
    merged.push({ s: cur.s, angle: cur.angle });
  }

  return merged.map(function (m) {
    var a = m.angle;
    return {
      s: m.s, angle: a,
      dir: Math.abs(a) > 150 ? 'uturn'
         : (Math.abs(a) > 55 ? (a > 0 ? 'right' : 'left')
         : (a > 0 ? 'slight-right' : 'slight-left')),
      done: {}
    };
  });
}

/* 掉頭轉向如果係喺升降機邊度，就唔係真掉頭 —— 改做 'lift'。
 *
 * 原因係幾何：一個升降機井喺 2D 地圖上面係**一個點**。實測又一城嗰條井
 * z = 19.5 → 24.0 → 30.8 → 37.5 四個高度共用同一組座標，所以任何穿過井嘅
 * 路線畫出嚟都一定係「入到一個點再返轉頭出」，量到嘅夾角就係 153°。
 * 呢個唔係 splice 造成嘅假象（兩條腿喺 2D 上真係咁行），但佢亦唔係一個
 * 用戶做得到嘅動作 —— 用戶喺𨋢裡面，唔係掉頭。所以卡片同語音都應該講
 * 「搭升降機」，唔係「請掉頭」。
 *
 * **只改掉頭**。真係轉左／轉右照樣講返個轉向 —— 唔可以因為隔籬有部𨋢
 * 而食咗一個用戶真係要做嘅轉向指令。 */
function markLiftManeuvers(maneuvers, lifts) {
  if (!lifts || !lifts.length) return;
  for (var i = 0; i < maneuvers.length; i++) {
    var m = maneuvers[i];
    if (m.dir !== 'uturn') continue;
    for (var j = 0; j < lifts.length; j++) {
      var lf = lifts[j];
      if (Math.abs(lf.s - m.s) > CONFIG.LIFT_MARK_M) continue;
      m.dir = 'lift';
      m.liftUp = lf.dz >= 0;
      /* 目的地樓層**一定係 zB** —— zA 係入𨋢嗰層、zB 係出𨋢嗰層，
         同 Δz 嘅正負無關。（寫成 `dz >= 0 ? zB : zA` 就係攞錯邊：
         落𨋢嗰陣會講返**離開**嗰層，即係把樓上嘅樓層名派俾樓下。）
         對唔上已知樓層（levelName 回空字串）就唔講樓層名，
         退回「向上／向下」。 */
      m.liftLevel = levelName(lf.zB);
      lf.marked = true;
      break;
    }
  }
}

/* 投影到路線：回傳最近點嘅沿線距離 s 同垂直距離 d */
function projectToRoute(route, lng, lat) {
  var pts = route.pts, best = { s: 0, d: Infinity };
  for (var i = 0; i < pts.length - 1; i++) {
    var ax = pts[i][0], ay = pts[i][1], bx = pts[i + 1][0], by = pts[i + 1][1];
    var dx = bx - ax, dy = by - ay;
    var len2 = dx * dx + dy * dy;
    var u = len2 === 0 ? 0 : ((lng - ax) * dx + (lat - ay) * dy) / len2;
    u = Math.max(0, Math.min(1, u));
    var px = ax + u * dx, py = ay + u * dy;
    var d = metersBetween(lng, lat, px, py);
    if (d < best.d) {
      var segLen = route.cum[i + 1] - route.cum[i];
      best = { s: route.cum[i] + u * segLen, d: d };
    }
  }
  return best;
}

/* 由設施索引取返原始資料列（欄序見 data/kt_facilities.js 嘅 meta.fieldOrder）。
   旁白要睇名判斷類別（見 selectCues 同 facilityKind），所以要有名。 */
function facilityRow(idx) {
  var FAC = dataOrNull('KT_FACILITIES');
  return (FAC && FAC.list[idx]) || null;
}

/* 沿線設施：回傳真正嘅沿線距離 s（米）。
   注意：唔可以存 segment index —— 觸發排程要嘅係距離。 */
/* 設施點對應嘅圖節點 —— 高度同連通性檢查都要用。
 *
 * 設施點係行人網絡線段嘅中點，實測每一點最近嘅節點距離都係 0.0 米
 * （即係落正喺一個節點上面）。搵一次就快取，唔需要每個路線重建都掃
 * 14,322 個節點。 */
var FAC_NODE_CACHE = {};
function facilityNode(idx) {
  if (FAC_NODE_CACHE[idx] !== undefined) return FAC_NODE_CACHE[idx];
  var row = facilityRow(idx), res = null;
  if (row && GRAPH) {
    var best = -1, bd = Infinity;
    for (var i = 0; i < GRAPH.nodes.length; i++) {
      var d = metersBetween(row[0], row[1], GRAPH.nodes[i][0], GRAPH.nodes[i][1]);
      if (d < bd) { bd = d; best = i; }
    }
    if (best >= 0) res = { node: best, dist: bd, z: GRAPH.nodes[best][2] };
  }
  FAC_NODE_CACHE[idx] = res;
  return res;
}

/* 由路線呢一點行唔行得到去嗰個設施？（Dijkstra，**冇距離上限**）
 *
 * 用返輪椅嘅**可通行性**（樓梯／扶手電梯／屏障唔行得），唔用坡度權重 ——
 * 問題係「去唔去到」，唔係「邊條路舒服」，更加唔係「行幾遠」。
 *
 * **呢個閘門喺兩條示範路線上面唔會剔走任何嘢** —— 唯一真正去唔到嘅係
 * #17 沙福道天橋（輪椅要經樓梯先上得到），而佢 Δz 4.70 米，高度閘門
 * 已經先剔走咗。保留佢係因為「唔可以向輪椅用戶講一個佢永遠去唔到嘅
 * 設施」係一個真嘅正確性保證，唔係因為佢今日做緊嘢。
 *
 * 曾經用過一個距離預算（1.6 × 橫向距離 + 15 米），係錯嘅：實測每個
 * 超出預算嘅設施，放寬上限之後都行得到（reach(unbounded)=Y），即係
 * 被封鎖嘅唔係圖嘅連通性，而係我自己訂嘅預算。受害者係 #185
 * 又一城升降機 —— 7.2 米外、同一個高度、真係行得到 —— 因為佢喺商場
 * 另一邊入口入，要行多過 26.5 米。假陰性：用戶聽少咗一部真升降機。
 *
 * 判斷唔到就回 true（唔可以因為我哋查唔到就唔講）：設施離行人網絡太遠
 * （> 12 米，即係根本唔喺呢個網絡上面）就唔判斷。 */
function facilityReachable(fromNode, toNode) {
  if (!GRAPH || fromNode < 0 || toNode < 0) return true;
  if (fromNode === toNode) return true;
  var dist = {}, pq = new Heap();
  dist[fromNode] = 0;
  pq.push(0, fromNode);
  while (!pq.empty()) {
    var top = pq.pop(), cur = top[1], dcur = top[0];
    if (dcur > (dist[cur] === undefined ? Infinity : dist[cur])) continue;
    if (cur === toNode) return true;
    var list = ADJ[cur] || [];
    for (var k = 0; k < list.length; k++) {
      var e = GRAPH.edges[list[k]];
      if (e[4] & HARD_EXCLUDE) continue;        // 輪椅行唔到嘅邊唔算
      var nd = dcur + e[2];
      var nx = (e[0] === cur) ? e[1] : e[0];
      if (dist[nx] === undefined || nd < dist[nx]) { dist[nx] = nd; pq.push(nd, nx); }
    }
  }
  return false;
}

/* zs：同 pts 平行嘅節點高度（設施配對要同一個高度先算「喺你條路上」）
   path：圖節點索引，連通性檢查要用路線上面嗰點做起點 */
function nearbyFacilities(pts, cum, zs, path, maxDist) {
  var out = [];
  var FAC = dataOrNull('KT_FACILITIES');
  var types = FAC ? FAC.types : [];
  var list = FAC ? FAC.list : [];

  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    var bx = f[0], by = f[1], bd = Infinity, bs = 0, bj = 0, bu = 0;
    for (var j = 0; j < pts.length - 1; j++) {
      var ax = pts[j][0], ay = pts[j][1], cx = pts[j + 1][0], cy = pts[j + 1][1];
      var dx = cx - ax, dy = cy - ay, len2 = dx * dx + dy * dy;
      var u = len2 === 0 ? 0 : ((bx - ax) * dx + (by - ay) * dy) / len2;
      u = Math.max(0, Math.min(1, u));
      var d = metersBetween(bx, by, ax + u * dx, ay + u * dy);
      if (d < bd) {
        bd = d;
        bs = cum[j] + u * (cum[j + 1] - cum[j]);   // 真·沿線距離
        bj = j; bu = u;                            // 記住投影位置，用嚟取路線高度
      }
    }
    if (bd >= maxDist) continue;

    /* 高度閘門：設施同路線喺投影點嘅高度差（見 CONFIG.FAC_SAME_LEVEL_M）。
       唔比對高度的話，上一層嘅設施會被講成「喺你條路上」。 */
    var fn = facilityNode(i);
    var zr = (zs && zs.length > bj + 1)
      ? zs[bj] + bu * (zs[bj + 1] - zs[bj]) : null;
    var dz = (fn && zr !== null) ? fn.z - zr : 0;
    if (Math.abs(dz) > CONFIG.FAC_SAME_LEVEL_M) continue;

    /* 連通性閘門：同一個高度都要行得到過去先算。
       用返路線上面嗰個節點做起點 —— 用戶就係企喺嗰度。
       路線本身係用 HARD_EXCLUDE 揀出嚟嘅，所以段頭同段尾必然喺同一個
       可通行連通區，用邊一端做起點都一樣。 */
    if (fn && fn.dist <= 12 && path && path.length > bj) {
      if (!facilityReachable(path[bj], fn.node)) continue;
    }

    out.push({ lng: bx, lat: by, type: types[f[2]], d: bd, s: bs,
               idx: i, nameTC: f[3], nameEN: f[4], dz: dz });
  }
  // 同一位置唔好重複播（例如連續幾個有蓋通道標記）
  out.sort(function (a, b) { return a.s - b.s; });
  var dedup = [];
  for (var k = 0; k < out.length; k++) {
    if (dedup.length && Math.abs(dedup[dedup.length - 1].s - out[k].s) < 12 &&
        dedup[dedup.length - 1].type === out[k].type) continue;
    dedup.push(out[k]);
  }
  return dedup;
}

/* 地標選取：唔可以變成不停講嘢 —— 用戶要求「偶爾」 */
function selectLandmarks(pts, cum, maneuvers) {
  var cands = [];
  var i, j;

  function push(name, lng, lat, sal, kind, brand) {
    var bx = lng, by = lat, bd = Infinity, bs = 0;
    for (var k = 0; k < pts.length - 1; k++) {
      var ax = pts[k][0], ay = pts[k][1], cx = pts[k + 1][0], cy = pts[k + 1][1];
      var dx = cx - ax, dy = cy - ay, len2 = dx * dx + dy * dy;
      var u = len2 === 0 ? 0 : ((bx - ax) * dx + (by - ay) * dy) / len2;
      u = Math.max(0, Math.min(1, u));
      var d = metersBetween(bx, by, ax + u * dx, ay + u * dy);
      if (d < bd) { bd = d; bs = cum[k] + u * (cum[k + 1] - cum[k]); }
    }
    // 30m 先算「睇得到」。地標提示嘅用途係俾用家**望到**嚟確認行啱路，
    // 隔咗成條街嘅名冇用（實測 44m 外嘅商戶都會被選中）。
    if (bd > 30) return;
    // 左右：路線方向同「路線點 → 地標」向量嘅叉積
    var si = 0;
    while (si < cum.length - 1 && cum[si + 1] < bs) si++;
    var ax2 = pts[si][0], ay2 = pts[si][1];
    var nx2 = pts[Math.min(si + 1, pts.length - 1)][0];
    var ny2 = pts[Math.min(si + 1, pts.length - 1)][1];
    var hx = (nx2 - ax2) * Math.cos(ay2 * Math.PI / 180), hy = (ny2 - ay2);
    var vx = (lng - ax2) * Math.cos(ay2 * Math.PI / 180), vy = (lat - ay2);
    var cross = hx * vy - hy * vx;
    var side = Math.abs(cross) < 1e-12 ? 'ahead' : (cross > 0 ? 'left' : 'right');

    cands.push({ name: name, s: bs, d: bd, salience: sal, kind: kind,
                 brand: !!brand, side: side, announced: false });
  }

  var LM = dataOrNull('KT_LANDMARKS') || [];
  for (i = 0; i < LM.length; i++) {
    push(S.lang === 'en' && LM[i].enOk ? LM[i].nameEN : LM[i].nameTC,
         LM[i].lng, LM[i].lat, LM[i].salience, LM[i].category);
  }
  var POI = (dataOrNull('KT_POIS') || {}).list || [];
  for (i = 0; i < POI.length; i++) {
    var p = POI[i];
    var nm = pickPoiName(p);
    if (!nm) continue;                 // 冇中文名又唔係品牌 → 唔講
    /* 品牌排 salience 1：品牌招牌係最易一眼認到嘅辨路標誌（用戶要嘅
       正正係「Apple 商店在右手邊」呢種確認）。原本一律 +1，令 Apple Store
       由 4 變 5，排序上輸晒俾政府地標，永遠選唔中。
       非品牌商戶維持 +1（唔想成條街都係鋪頭名）。 */
    push(nm, p.lng, p.lat, p.brand ? 1 : p.salience + 1, p.kind, p.brand);
  }

  // 顯著度優先，再按沿線距離
  cands.sort(function (a, b) {
    return (a.salience - b.salience) || (a.s - b.s);
  });

  /* 間隔約束：兩個地標至少隔 80m；上限 5 個。
   *
   * 但品牌地標放寬到 45m。實測路線 A：Taste（113m）、Apple Store（174m）、
   * MCL Cinema（260m）三個品牌招牌相隔只係 61m 同 86m —— 用 80m 規則會
   * 將 Apple Store 剔走，而佢正正係用戶點名要嘅「apple 商店在右手邊」。
   * 品牌招牌係最易一眼認到嘅辨路標誌，密度高少少係值得嘅；
   * 非品牌（政府地標／商戶）維持 80m，唔想成條街都係鋪頭名。 */
  var chosen = [];
  for (i = 0; i < cands.length && chosen.length < 5; i++) {
    var c = cands[i], ok = true;
    var gap = c.brand ? 45 : 80;
    for (j = 0; j < chosen.length; j++) {
      if (Math.abs(chosen[j].s - c.s) < gap) { ok = false; break; }
      /* 同一棟建築物只講一次。
         實測路線 A 喺 272–284 米一段有大家樂、牛角、肯德基、胡椒廚房、
         無印良品五個 POI —— 全部喺又一城裏面。淨係靠 80 米沿線間隔
         會隨機揀到其中一間鋪頭，講「右手邊係牛角」對認路冇幫助，
         應該講返個商場。所以橫向位置相近（<12 米）嘅只留排序最高嗰個。 */
      if (Math.abs(chosen[j].d - c.d) < 12 &&
          Math.abs(chosen[j].s - c.s) < 40) { ok = false; break; }
    }
    if (!ok) continue;
    // 同名唔重複（OSM 同政府數據可能都有「又一城」）
    for (j = 0; j < chosen.length; j++) {
      if (chosen[j].name === c.name) { ok = false; break; }
    }
    if (!ok) continue;
    chosen.push(c);
  }

  // 優先保留「轉彎後 30m 內」嘅地標 —— 嗰陣最需要確認行啱路
  chosen.sort(function (a, b) { return a.s - b.s; });
  return chosen;
}

/* 揀 POI 顯示名。
 *
 * 原本係 `return p.tcOk ? p.nameTC : ''` —— 即係中文模式下冇中文名嘅商戶
 * 一律唔講。Apple Store 正正係 tcOk:false，所以佢雖然投影到路線 A
 * 174 米處、橫向 10 米、右手邊（位置完全正確），都被 drop 咗。
 * 用戶要求「例如 apple 商店在右手邊」，但個提示永遠唔會出現。
 *
 * 修法：冇中文名但係品牌（brand 有值）就照讀英文品牌名 ——
 * 香港人講嘢本身就夾雜「Apple Store」「Taste」，聽落自然。
 * 冇中文名又唔係品牌就照舊唔講：用中文語音讀純英文名唔似人話。 */
function pickPoiName(p) {
  if (S.lang === 'en') return p.nameEN || p.nameTC || '';
  if (p.tcOk) return p.nameTC;
  if (p.brand) return p.nameEN || p.brand;
  return '';
}

/* 升降機／斜道提示（route.cues）。
 *
 * 用戶想要「多啲升降機／斜道嘅路線」，但實測冇路線槓桿：
 *   · 圖內升降機邊只有 29 條、總長 10 米 —— LIFT_K 由 1.0 降到 0.5 對路線零影響
 *   · 斜道鄰近獎勵由 0% 加到 40%，路線完全不變（639 米）
 *   · 路線 A 本身已經經過 29 個貼近升降機、22 個貼近斜道嘅路口（30 米內）
 * 即係「唔需要繞路都已經經過」。所以正確做法係**講出嚟**，唔係改路線 ——
 * 加獎勵只會係死代碼，仲有為咗繞路而繞路嘅風險（用戶明確話唔想）。
 *
 * 對象係離線 22–40 米嘅設施：22 米內嘅已經由 route.facilities 喺 s-30 講咗，
 * 唔可以重複；40 米外嘅仲喺視線範圍，講出所屬建築對認路有用。
 */
/* 旁述軌接住設施軌：設施軌講「喺路徑上」（<= FAC_ON_PATH_D），
   旁述軌講「喺側邊 8–40 米」。以前呢度係 22，即 8–22 米嗰批兩邊都唔講；
   而家無縫。 */
var CUE_MIN_D = 8, CUE_MAX_D = 40;
var CUE_MIN_GAP = 60, CUE_LIMIT = 4;
function selectCues(pts, cum, zs, path, onRoute) {
  var raw = nearbyFacilities(pts, cum, zs, path, CUE_MAX_D);
  var used = {};
  var i, j;
  /* 只有**設施軌真係會講**嘅設施先算「講咗」。以前呢度將所有 22 米內嘅
     設施一律標做已講 —— 但設施軌只講 8 米內（FAC_ON_PATH_D），所以
     8–22 米嗰批兩邊都唔講，變成靜音帶。註釋一直寫住「兩個軌道無縫」，
     但 `used` 係用 22 米集合建立，實際一直有 14 米闊嘅缺口。
     （呢個係 CLAUDE.md 講「CUE_MIN_D 由 22 改 8 令兩軌相接」之後仍然存在
     嘅問題 —— 改 CUE_MIN_D 對嗰批設施完全冇作用，因為 `used` 已經攔咗。） */
  for (i = 0; i < onRoute.length; i++) {
    if (onRoute[i].d <= CONFIG.FAC_ON_PATH_D) used[onRoute[i].idx] = true;
  }

  var out = [];
  for (i = 0; i < raw.length; i++) {
    var f = raw[i];
    /* 名優先過 typeIdx。設施檔有 29 條叫「…扶手電梯」嘅記錄被歸類做 lift ——
       扶手電梯輪椅用唔到，旁述句寫「有升降機，可以用」係直接誤導目標用戶。
       所以呢類要**分開處理**，唔可以當佢係升降機：
         · 輪椅／推車模式 → 完全唔講（用戶用唔到，講嚟做乜）
         · 冇輪椅模式     → 照講，但講明係「扶手電梯」
       （地圖標記同樣以名為準，唔會再畫成一個藍色圓形。） */
    var kind = isEscalatorName(f.nameTC, f.nameEN) ? 'escalator' : f.type;
    if (kind !== 'lift' && kind !== 'ramp' && kind !== 'escalator') continue;
    if (kind === 'escalator' && S.wheel) continue;
    if (f.d < CUE_MIN_D) continue;          // 已經由設施提示講咗
    /* 冇建築物名嘅，講咗都幫唔到認路（見 cueNameUsable：冇名同淨係街名
       都算冇名）。喺呢度先剔除，唔好白佔 4 個配額 —— 否則一句都冇用嘅
       旁述會擠走後面真係講得出「右手邊係又一城」嘅一句。 */
    if (!cueNameUsable(f.nameTC, f.nameEN)) continue;
    if (used[f.idx]) continue;
    out.push({
      s: f.s, d: f.d, type: kind, idx: f.idx,
      nameTC: f.nameTC, nameEN: f.nameEN, side: sideOfRoute(pts, cum, f.s, f.lng, f.lat),
      announced: false
    });
  }

  // 沿線間隔：唔可以變成不停講嘢（用戶要「偶爾」）
  // 同名嘅亦只講一次（同一棟大樓唔同位置嘅兩個設施，講兩次只會令人混亂）
  out.sort(function (a, b) { return a.s - b.s; });
  var chosen = [];
  for (i = 0; i < out.length && chosen.length < CUE_LIMIT; i++) {
    var ok = true;
    for (j = 0; j < chosen.length; j++) {
      if (Math.abs(chosen[j].s - out[i].s) < CUE_MIN_GAP) { ok = false; break; }
      if (chosen[j].nameTC && chosen[j].nameTC === out[i].nameTC) { ok = false; break; }
    }
    if (ok) chosen.push(out[i]);
  }
  return chosen;
}

/* 左右判定 —— 同 selectLandmarks 用同一套叉積，唔另寫一套。 */
function sideOfRoute(pts, cum, s, lng, lat) {
  var si = 0;
  while (si < cum.length - 1 && cum[si + 1] < s) si++;
  var ax = pts[si][0], ay = pts[si][1];
  var nx = pts[Math.min(si + 1, pts.length - 1)][0];
  var ny = pts[Math.min(si + 1, pts.length - 1)][1];
  var hx = (nx - ax) * Math.cos(ay * Math.PI / 180), hy = (ny - ay);
  var vx = (lng - ax) * Math.cos(ay * Math.PI / 180), vy = (lat - ay);
  var cross = hx * vy - hy * vx;
  if (Math.abs(cross) < 1e-12) return 'ahead';
  return cross > 0 ? 'left' : 'right';
}

/* ===== 6. 提示排程 ===================================================== */

function facilityWord(type) {
  if (type === 'lift') return t('fLift');
  if (type === 'ramp') return t('fRamp');
  if (type === 'escalator') return t('fEscalator');
  return t('fCovered');
}

/* 設施提示句。
   唔用「前面{m}米有{設施}」呢個通用模板 —— 因為「有」+「有蓋通道」
   會變成「有有蓋通道」，讀出嚟唔似人話。每類各自一句。 */
/* m = 仲有幾多米先到。m <= 0（已經行到／啱啱過咗）唔可以講「前面負3米」，
   改成「呢度有…」—— 用戶就係企喺嗰度。
   g = 斜道坡度（ratio，其他類型係 null）。 */
function facilitySentence(type, m, g) {
  /* 斜道要先睇坡度：一條 38% 嘅斜道講「可以用」係講唔通嘅（見 CONFIG.RAMP_OK_G）。
     g 係 null（數據冇坡度）就當普通斜道 —— 唔可以因為冇數據就反而唱衰佢。 */
  if (type === 'ramp' && typeof g === 'number' && g > CONFIG.RAMP_OK_G) {
    var p = Math.round(g * 100);
    if (g > CONFIG.RAMP_MAX_G) {
      return m <= 0 ? fmt(t('nRampTooSteepHere'), { p: p })
                    : fmt(t('nRampTooSteep'), { m: m, p: p });
    }
    return m <= 0 ? fmt(t('nRampSteepHere'), { p: p })
                  : fmt(t('nRampSteep'), { m: m, p: p });
  }
  if (m <= 0) return fmt(t('nFacilityHere'), { facility: facilityWord(type) });
  if (type === 'covered') {
    return fmt(t('nFacilityCovered'), { m: m });
  }
  return fmt(t('nFacility'), { m: m, facility: facilityWord(type) });
}

/* 設施名尾嘅類別詞要拆走。
 *
 * 政府數據嘅名係「建築物／街道 + 類別」：「又一城斜道」「達之路隧道」
 * 「教育局九龍塘教育服務中心扶手電梯」。照名讀出嚟就係
 * 「左手邊係又一城斜道，有斜道。」—— 同一個詞講兩次，唔似人話。
 * 拆走尾嗰個類別詞，剩低嘅「又一城」正正就係用戶認路要用嘅資訊。
 *
 * 順帶解決「冇建築物名」嘅情況：23 條設施就叫「升降機」、5 條叫「斜道」、
 * 2 條叫「扶手電梯」—— 拆完變空字串，即係冇資訊，唔應該講
 * （「左手邊有升降機，可以用」幫唔到認路）。用戶決定：呢類唔再講。
 *
 * 第三種「拆完都冇資訊」係**街名**：政府數據用街道命名設施（「達之路斜道」
 * 「南昌街天橋」），拆走尾綴淨低嘅就係用戶行緊嗰條路本身。實測 236 條
 * 設施有 78 條係咁命名（其中 16 條係斜道，而只有斜道／升降機／扶手電梯
 * 會入 cue 軌）。「右手邊係達之路，有斜道。」同「左手邊有斜道」一樣幫唔到
 * 認路（達之路就係佢行緊嗰條），但仲會白佔一個 cue 配額。用戶就係報告呢句：
 * 「第一段路，沒有斜道標識但還是説了」—— 設施喺路線右邊 32 米，冇一個
 * 建築物名畀佢對得上。
 *
 * 一個規則同時解決三件事，唔需要另外維護一張「通用名」清單 ——
 * 清單一定會同實際資料走樣。
 */
var FACILITY_SUFFIX = /(扶手電梯|升降機|斜道|隧道|天橋|有蓋通道|行人天橋|行人隧道|escalator|lift|elevator|ramp|covered walkway|footbridge|subway|underpass)+$/i;

/* 街名。只喺 stripFacilitySuffix 之後套用 —— 「桃源街遊樂場」剝完尾綴係
   「桃源街遊樂場」（尾字係「場」），唔會被誤殺；「達之路斜道」剝完係
   「達之路」，中招。 */
var STREET_NAME = /(道|街|路|里|巷|徑|坊|Avenue|Road|Street|Lane|Drive|Path|Highway)$/i;

function stripFacilitySuffix(nm) {
  return String(nm == null ? '' : nm).replace(FACILITY_SUFFIX, '').trim();
}

/* 剝完尾綴之後，剩返一個**講得出**嘅地名？街名唔算。 */
function cuePlaceName(nm) {
  var s = stripFacilitySuffix(nm);
  return (s && !STREET_NAME.test(s)) ? s : '';
}

/* 有冇一個「講得出嘅」名？中英都要睇：路線只建一次、唔會跟介面語言重建，
   只睇當前語言嘅話，切換語言之後就會忽然多返幾句出嚟。 */
function cueNameUsable(tc, en) {
  return !!(cuePlaceName(tc) || cuePlaceName(en));
}

/* 升降機／斜道／扶手電梯旁述句。
 * 重點係講出**所屬建築物**（「右手邊係又一城，有升降機」）。
 * 冇建築物名就回傳空字串 —— 呼叫方唔會出聲（見 §6）。 */
function cueSentence(cue) {
  var facility = facilityWord(cue.type);
  /* 用 cuePlaceName 而唔係 stripFacilitySuffix：揀名同過濾要用同一把尺，
     否則英文介面會揀到中文側過濾走咗嘅街名（見上）。 */
  var name = S.lang === 'en'
    ? (cuePlaceName(cue.nameEN) || cuePlaceName(cue.nameTC))
    : (cuePlaceName(cue.nameTC) || cuePlaceName(cue.nameEN));
  if (!name) return '';
  var key = cue.side === 'left' ? 'nCueL'
          : cue.side === 'right' ? 'nCueR' : 'nCueAhead';
  return fmt(t(key), { name: name, facility: facility });
}

/* 每個 tick 檢查有冇提示要出 */
function checkTriggers(route, s) {
  var i, m, f, l;

  // --- 轉向：遠距預告 / 接近 / 到達
  //
  // 一次只講**一個**轉向，而且一定係**指令卡當前顯示嗰個**，距離用實際剩餘米數。
  //
  // 原本係逐個轉向各自計時（任何轉向一到 s ≥ m.s−60 就播），呢個寫法假設
  // 轉向之間相隔多過 60 米。實測路線 B 有五對轉向相隔 50 / 37 / 25 / 27 / 37 米，
  // 於是行到 45 米時：卡片正確顯示「轉右」（69 米嗰個），語音已經偷步播咗
  // 105 米嗰個嘅「前面 60 米要轉左」—— 就係用戶報「文字對、語音錯方向」。
  //
  // 第一次修復（只講最前面未講完嗰個）仍然漏咗一種情況：卡片要等到
  // s ≥ 上一個轉向 + 12 米才轉去下一個轉向，所以喺嗰 12 米交接窗入面，
  // 語音已經可以講下一個轉向 —— 上例 gap 37 米時就係 s ∈ [69, 81)：
  // 卡片仍然顯示「轉右」，語音講「前面36米要轉左喇」。一模一樣嘅錯。
  //
  // 所以改為**跟卡片**：卡片顯示邊個轉向，就只講嗰個。卡片係用戶眼前嘅
  // 事實來源（用戶自己講「文字導航是沒問題的」），語音跟住佢，方向就
  // 由建構上唔可能對唔上。
  //
  // 三段提示一句都冇刪（用戶明確要求）：遠距預告照樣會講，只係相鄰太近嘅
  // 轉向，開始講嗰陣實際距離已經唔夠 60 米，所以會如實讀出真數字
  // （「前面38米要轉右喇」），而唔會夾硬報一個假嘅 60 米。
  m = currentManeuver(route, s);
  if (!m) {
    // 過咗最後一個轉向 12 米之後 currentManeuver 會回 null ——
    // 執漏：攞最前面未講完嗰個，否則最後一句「而家轉右」會冇人講。
    for (i = 0; i < route.maneuvers.length; i++) {
      if (!route.maneuvers[i].done['0']) { m = route.maneuvers[i]; break; }
    }
  }
  if (m) {
    var dirWord = t(m.dir === 'left' ? 'turnLeft'
                  : m.dir === 'right' ? 'turnRight'
                  : m.dir === 'slight-left' ? 'slightLeft'
                  : m.dir === 'slight-right' ? 'slightRight'
                  : m.dir === 'lift' ? 'liftWord' : 'uTurn');
    var left = m.s - s;
    var stage = (left <= 0) ? '0' : (left <= 20) ? '20' : (left <= 60) ? '60' : null;
    if (stage && !m.done[stage]) {
      // 較後嘅階段一講，之前嘅就當講過，唔可以之後回頭補播（次序會亂）
      if (stage === '0') { m.done['60'] = true; m.done['20'] = true; }
      if (stage === '20') { m.done['60'] = true; }
      m.done[stage] = true;
      var txt;
      if (m.dir === 'lift') {
        /* 升降機：60 米同 20 米兩段由呢度講（同轉向一樣，卡片顯示嗰個就講嗰個）。
           **「埋身」嗰段唔喺呢度講** —— 佢屬於 §10 嘅搭𨋢處理，因為嗰度同時
           要停 LIFT_HOLD_MS 模擬升降（停低同旁白要係同一件事），而且嗰句連
           樓層名都由嗰度出。呢度照樣 m.done['0'] = true，免得佢一直掛住。 */
        txt = (stage === '20')
            ? (m.liftLevel
               ? fmt(t('nLiftSoonNearLevel'),
                     { m: Math.round(left), level: m.liftLevel,
                       uw: t(m.liftUp ? 'liftUpWord' : 'liftDownWord') })
               : fmt(t('nLiftSoonNear'), { m: Math.round(left) }))
            : fmt(t('nLiftSoon'), { m: Math.round(left) });
        if (stage === '0') txt = null;
      } else {
        txt = (stage === '0') ? fmt(t('nTurnNow'), { dir: dirWord })
            : (stage === '20') ? fmt(t('nTurnSoonNear'), { m: Math.round(left), dir: dirWord })
            : fmt(t('nTurnSoon'), { m: Math.round(left), dir: dirWord });
      }
      // key 用轉向本身嘅索引，唔可以再用迴圈變數 i —— 主要路徑而家唔經迴圈
      if (txt) narratorSay(txt, 3, 'turn' + route.maneuvers.indexOf(m) + stage);
    }
  }

  // --- 設施：s-30 預告
  for (i = 0; i < route.facilities.length; i++) {
    f = route.facilities[i];

    // 有蓋通道係連續嘅，唔可以逐個標記播報 ——
    // 實測會變成「前面30米有有蓋通道」講足四次。
    // 只有落雨先值得講，而且全程最多講兩次。
    if (f.type === 'covered') {
      if (!S.rain) { f.announced = true; continue; }
      if (route._coveredSaid >= 2) { f.announced = true; continue; }
    }

    /* 只講**真係喺路徑上**嘅設施。
       以前呢度冇呢個檢查，22 米走廊內乜都照講，於是路線 A 會講
       「前面30米有斜道，可以用」而嗰條斜道橫向 18 米、喺條路側邊。
       用戶行到去望唔到斜道 —— 就係「報錯無障礙設施」。
       側邊 8–40 米嘅交返俾旁述軌（cue），佢會如實講「右手邊係…，有升降機」。
       兩個軌道加埋無縫亦無重疊。 */
    if (f.d > CONFIG.FAC_ON_PATH_D) { f.announced = true; continue; }

    /* 路線真係搭嘅嗰部𨋢已經由轉向軌講咗三次（見 buildRoute），
       唔可以再喺呢度講多一次「前面30米有升降機，可以用」。 */
    if (f.liftRidden) { f.announced = true; continue; }

    if (!f.announced && s >= f.s - 30 && s <= f.s + 8) {
      f.announced = true;
      var row = facilityRow(f.idx);
      var kind = row ? facilityKind(row, f.type) : f.type;
      /* 扶手電梯唔可以講「有升降機，可以用」—— 輪椅用唔到。
         數據有 29 條叫「…扶手電梯」嘅記錄被歸類做 lift，所以一定要靠名
         判斷。輪椅／推車模式一律唔講（用戶用唔到，講嚟做乜）；冇輪椅模式
         就照講，而且講明係扶手電梯。 */
      if (kind === 'escalator' && S.wheel) continue;
      if (kind === 'covered') route._coveredSaid++;
      /* 距離一定要**真**（以前寫死 30）。寫死嘅後果：斜道喺 s=1 米，
         一開場就講「前面30米有斜道」，而用戶企喺斜道上面 ——
         佢望住前面 30 米，當然咩都見唔到，就係「地圖根本冇顯示有斜道」。
         同轉向旁白係一模一樣嘅錯：一個只在作者測試嗰個情況先啱嘅常數。 */
      /* row[6] = 斜道坡度（見 CONFIG.RAMP_OK_G）。其他類型係 null。 */
      narratorSay(facilitySentence(kind, Math.round(f.s - s), row ? row[6] : null),
                  2, 'fac' + i);
    }
  }

  // --- 升降機／斜道旁述：s-15，優先級 1
  // 同轉向（3）、設施（2）都唔同級，永遠唔會搶佢哋 —— 旁述係錦上添花。
  for (i = 0; i < route.cues.length; i++) {
    var c = route.cues[i];
    if (!c.announced && s >= c.s - 15) {
      c.announced = true;
      // 冇建築物名嘅一句係空字串 —— 唔出聲（用戶要求唔再講）
      var cueTxt = cueSentence(c);
      if (cueTxt) narratorSay(cueTxt, 1, 'cue' + i);
    }
  }

  // --- 地標：s 一到就講
  for (i = 0; i < route.landmarks.length; i++) {
    l = route.landmarks[i];
    if (!l.announced && s >= l.s) {
      l.announced = true;
      var txt = l.side === 'left' ? fmt(t('nLandmarkL'), { name: l.name })
              : l.side === 'right' ? fmt(t('nLandmarkR'), { name: l.name })
              : fmt(t('nLandmarkAhead'), { name: l.name });
      narratorSay(txt, 1, 'lm' + i);
    }
  }
}

/* ===== 7. 旁白器 ========================================================
   核心修正：唔可以 await 語音去阻塞位置更新。
   位置同語音完全解耦；單槽；只喺嚴格更高優先級時打斷。
   ====================================================================== */

var narrator = {
  busy: false,
  priority: -1,
  timer: null,
  poll: null,      // 輪詢 speechSynthesis.speaking 嘅 handle
  retry: [],       // 被更高優先級搶佔而丟棄嘅提示，保留重試資格
  /* 用戶撳咗暫停（見 pauseSpeech）。暫停期間：
       · speechSynthesis 本身都 pause 咗（唔係 cancel —— 要可以續播）
       · 唔會開始新句子（narratorDrain 早退）
       · **唔會**當正在播嗰句講完（輪詢同 watchdog 都唔可以響）
     三個都要做齊，缺一個就會出現「撳咗暫停，語音照樣播落去／跳下一句」。 */
  suspended: false
};

/* 世代編號。narrator.poll / narrator.timer 都係單槽，而輪詢鏈係自我重排嘅
 * 遞迴 setTimeout：一旦句子被搶佔，舊鏈嘅 handle 會被新鏈覆蓋，舊鏈就
 * 永遠冇人 clear，仍然會喺之後某一刻叫 finish() —— 而嗰陣佢已經唔再代表
 * 正在播緊嘅句子，結果係「新句播到一半就被當成講完」。加一個世代編號，
 * 舊鏈一發現自己唔係最新就靜靜咁死。 */
var narratorGen = 0;

var RETRY_WINDOW_M = 15;   // 喺 15 米內仍然可以重試

/* 估算一句要講幾久（毫秒）。
 *
 * 舊版用 `text.length * 150`：19 字嘅開場白 → 2850ms。但廣東話 rate 0.85
 * 講 19 個字實際要 5–7 秒。於是 watchdog 提早響 → narrator.busy 提早變
 * false → narratorDrain() 即刻補播下一個轉向提示 → speak() 又 cancel() →
 * 開場白被斬。兩個缺陷一齊發生，所以係必然，唔係偶然。
 *
 * 分開成一個函數係為了同 harness 用同一條公式：測試嘅語音 stub 一定要
 * 按同一條式推算時長，否則佢會喺 50ms 就當講完，結構上永遠測唔到呢類 bug。 */
var MS_PER_CJK = 300;      // 漢字（rate 0.85）
var MS_PER_LATIN = 90;     // 拉丁字母／數字
var SPEECH_MS_MIN = 4000, SPEECH_MS_MAX = 30000;
function speechMs(text) {
  var cjk = 0, latin = 0, i;
  for (i = 0; i < text.length; i++) {
    if (text.charCodeAt(i) > 0x2E80) cjk++; else latin++;
  }
  var ms = cjk * MS_PER_CJK + latin * MS_PER_LATIN;
  return Math.min(Math.max(ms, SPEECH_MS_MIN), SPEECH_MS_MAX);
}

function narratorBusy() { return narrator.busy; }

/* remember=false 用於「點標記睇設施資訊」之類嘅旁述：
   佢要經 live region 報讀，但唔應該蓋掉「再講一次」記住嘅導航指令。 */
function narratorSay(text, priority, key, remember) {
  if (!text) return;
  if (remember !== false) S.lastSpoken = text;

  var log = document.getElementById('narrator-log');
  if (log) log.textContent = text;
  var st = document.getElementById('a11y-status');
  if (st) st.textContent = text;

  if (narrator.busy) {
    if (priority <= narrator.priority) {
      // 唔排隊（避免堆積截斷），但保留重試資格：
      // 否則會出現「標記咗已播報，但用家其實冇聽到」——
      // 呢個正是舊 app 漏轉向嘅成因之一。
      if (priority >= 1) {
        narrator.retry.push({
          text: text, priority: priority, key: key,
          expireS: (S.walk ? S.walk.s : 0) + RETRY_WINDOW_M
        });
      }
      return;
    }
    cancelSpeech();                              // 嚴格更高 → 打斷
  }

  narrator.busy = true;
  narrator.priority = priority;
  narratorGen++;
  var myGen = narratorGen;

  var done = false;
  function finish() {
    if (done) return;      // idempotent latch
    done = true;
    // 已經有新句子接手 —— 呢個 finish 係舊世代嘅殘留回呼，唔可以再動狀態
    if (myGen !== narratorGen) return;
    if (narrator.timer) { clearTimeout(narrator.timer); narrator.timer = null; }
    if (narrator.poll) { clearTimeout(narrator.poll); narrator.poll = null; }
    narrator.busy = false;
    narrator.priority = -1;
    /* 暫停期間唔可以接住播下一句 —— 否則用戶撳咗暫停，仲會聽到新嘅
       提示（例如「前面20米要轉左」），佢會以為個掣壞咗。恢復嗰陣
       togglePlay 會自己叫一次 narratorDrain() 補返。 */
    if (narrator.suspended) return;
    narratorDrain();
  }

  speak(text, finish);

  /* 完成訊號有三重，由最可靠排到最後：
     1. onend —— 正常路徑
     2. 輪詢 speechSynthesis.speaking —— onend 喺部分瀏覽器唔可靠（尤其
        係 cancel() 之後），而 speaking 係瀏覽器自己講嘅真話，比任何時長
        估算可靠。要有 600ms 寬限：speak() 之後 speaking 未必即刻變 true，
        否則會一叫就當講完。
     3. watchdog —— 只做「真正失控」嘅保險，唔再係正常完成路徑。
        佢一響就代表上面兩個訊號都冇觸發，屬異常，所以留低紀錄。
     暫停期間（narrator.suspended）2 同 3 都要停手：嗰陣「唔出聲」係
     用戶自己造成嘅，唔係講完，亦唔係失控。 */
  if (speechSynth && typeof speechSynth.speaking === 'boolean') {
    var pollTicks = 0;
    narrator.poll = setTimeout(function pollSpeaking() {
      if (done || myGen !== narratorGen) return;
      pollTicks++;
      if (!narrator.suspended && pollTicks >= 3 && !speechSynth.speaking) {
        finish(); return;
      }
      narrator.poll = setTimeout(pollSpeaking, 250);
    }, 250);
  }

  var watchdogMs = speechMs(text) * 1.6 + 2000;
  /* 暫停期間要重新上鏈而唔可以當佢失控：watchdogMs 係按「一路播落去」
     估算嘅，暫停幾久都唔應該令佢響。 */
  function armWatchdog() {
    narrator.timer = setTimeout(function () {
      if (done || myGen !== narratorGen) return;
      if (narrator.suspended) { armWatchdog(); return; }
      if (window.console && console.warn) {
        console.warn('[narrator] watchdog 觸發（onend 同 speaking 都冇回應）:', text);
      }
      finish();
    }, watchdogMs);
  }
  armWatchdog();
}

/* 閒置時補播被搶佔嘅提示；過期就丟棄 */
function narratorDrain() {
  if (narrator.busy || narrator.suspended || !narrator.retry.length) return;
  var nowS = S.walk ? S.walk.s : 0;
  var best = -1;
  for (var i = 0; i < narrator.retry.length; i++) {
    if (narrator.retry[i].expireS < nowS) continue;      // 過期
    if (best < 0 || narrator.retry[i].priority > narrator.retry[best].priority) best = i;
  }
  if (best < 0) { narrator.retry = []; return; }         // 全部過期
  var item = narrator.retry.splice(best, 1)[0];
  narratorSay(item.text, item.priority, item.key);
}

function narratorCancel() {
  /* 一定要先解除暫停再 cancel()。若果之前撳過暫停，speechSynthesis 仲係
     paused 狀態；cancel() 清隊列之後，部分引擎會留住 paused 旗標，之後
     所有 speak() 都會靜靜咁排隊唔出聲 —— 睇落就係「轉路線之後冇咗語音」。
     resume() 對冇暫停嘅情況係冇作用嘅，所以放心叫。 */
  narrator.suspended = false;
  resumeSpeech();
  cancelSpeech();
  if (narrator.timer) { clearTimeout(narrator.timer); narrator.timer = null; }
  if (narrator.poll) { clearTimeout(narrator.poll); narrator.poll = null; }
  narratorGen++;            // 令所有在途嘅回呼即刻失效
  narrator.busy = false;
  narrator.priority = -1;
  narrator.retry = [];
}

/* ===== 8. 語音 ========================================================= */

var speechSynth = window.speechSynthesis || null;
var VOICES = [];

function loadVoices() {
  if (!speechSynth) return;
  VOICES = speechSynth.getVoices() || [];
}

/* 「裝置冇廣東話語音」呢個警告，之前只喺 setLang() 入面，而 init() 由頭到尾
 * 冇叫過 setLang —— 即係預設載入路徑永遠唔會講。使用者只會覺得「把聲唔似
 * 廣東話」，唔知係部機冇，而唔係個 app 求其。
 *
 * 仲有第二層，同樣要處理：Chrome 第一次 getVoices() 通常回**空陣列**，之後
 * 先非同步補上並觸發 voiceschanged。所以檢查要喺兩處都叫（init 同
 * voiceschanged），而且空陣列唔可以當「冇廣東話」—— 冇資料唔等於壞消息。
 *
 * 每次載入只講一次，唔可以變成騷擾。 */
var voiceWarned = false;
function checkVoiceAvailability() {
  if (voiceWarned || S.lang !== 'zh-HK') return;
  loadVoices();
  if (!VOICES.length) return;          // 未有資料，等 voiceschanged 再講
  for (var i = 0; i < VOICES.length; i++) {
    var lg = (VOICES[i].lang || '').toLowerCase();
    if (lg.indexOf('zh') === 0 || lg.indexOf('yue') === 0) return;
  }
  voiceWarned = true;
  showToast(t('noVoice'));
}

if (speechSynth) {
  loadVoices();
  speechSynth.onvoiceschanged = function () {
    loadVoices();
    checkVoiceAvailability();
  };
}

/* 語音優先鏈；搵唔到廣東話要明確告知，唔可以靜靜轉英文 */
function pickVoice() {
  loadVoices();
  if (!VOICES.length) return null;
  var want = (S.lang === 'en')
    ? ['en-GB', 'en-US', 'en-AU', 'en']
    : ['zh-HK', 'yue-HK', 'zh-TW', 'zh-CN', 'zh'];
  var i, j;
  for (i = 0; i < want.length; i++) {
    for (j = 0; j < VOICES.length; j++) {
      if ((VOICES[j].lang || '').toLowerCase().indexOf(want[i].toLowerCase()) === 0) {
        return VOICES[j];
      }
    }
  }
  return null;
}

/* 講一句。**呢度唔可以自己 cancel()。**
 *
 * 之前呢度開頭有一句 `speechSynth.cancel()`，就係「開場白講到一半被斬」
 * 嘅主因：speak() 係旁白器唯一嘅發聲入口，所以連「閒置之後補播重試句」
 * 都會清空正在播緊嘅語音。取消係旁白器嘅決定 —— narratorSay() 喺嚴格
 * 更高優先級時已經自己叫 cancelSpeech()，唔應該喺呢層無條件做。 */
function speak(text, onDone) {
  if (!speechSynth) { if (onDone) setTimeout(onDone, 400); return; }

  var u = new SpeechSynthesisUtterance(text);
  var v = pickVoice();
  u.lang = (S.lang === 'en') ? 'en-GB' : 'zh-HK';
  if (v) { u.voice = v; u.lang = v.lang || u.lang; }
  u.rate = CONFIG.RATE;
  u.pitch = 1.0;
  u.onend = function () { if (onDone) onDone(); };
  u.onerror = function () { if (onDone) onDone(); };

  setTimeout(function () {
    try { speechSynth.speak(u); } catch (e) { if (onDone) onDone(); }
  }, 60);
}

function cancelSpeech() {
  if (!speechSynth) return;
  try { speechSynth.cancel(); } catch (e) {}
}

/* 暫停／繼續語音。用戶報告「撳咗暫停，語音照樣講落去」—— 因為
 * walker.pause() 只係清咗行路嘅 timer，完全冇掂過 speechSynthesis。
 *
 * 呢兩個函數**唔可以**擺入 walker.pause()／walker.resume()：beginAfterIntro()
 * 就係靠「先講開場白、再 pause 住個 walker 等佢講完」。如果 pause 順手停埋
 * 語音，開場白一開始就停住，永遠唔會有 onend，個等就永遠等唔完 —— 死鎖，
 * 而且係「一開始就卡住」嘅死鎖。所以暫停語音係 togglePlay()（用戶手勢）嘅事。
 *
 * 一定要用 pause() 而唔係 cancel()：cancel 會將講到一半嘅句子銷毀，
 * 恢復之後冇得續，用戶會覺得「一撳暫停就食咗半句」。而且 cancel 亦會令
 * narrator 嗰邊嘅世代鏈全部失效，變成要重新講過。
 *
 * 兩個都用 typeof 檢查：部分引擎（同測試 harness）冇呢兩個方法，
 * 冇就要靜靜咁退化，唔可以拋錯。 */
function pauseSpeech() {
  if (!speechSynth || typeof speechSynth.pause !== 'function') return false;
  try { speechSynth.pause(); return true; } catch (e) { return false; }
}

function resumeSpeech() {
  if (!speechSynth || typeof speechSynth.resume !== 'function') return false;
  try { speechSynth.resume(); return true; } catch (e) { return false; }
}

/* ===== 9. 地圖 ========================================================= */

/* 地圖失敗要有聲有色。
 *
 * 之前 initMap() 係靜靜咁 return（冇 mapboxgl、或者 constructor 拋錯都係），
 * 使用者見到嘅就係一個灰色空盒，而 #map 嘅 aria-label 由頭到尾都仍然聲稱
 * 「九龍塘無障礙路線地圖」—— 螢幕報讀使用者會以為地圖喺度。
 *
 * 最重要嘅事實：路線規劃、設施資料、旁述全部係本機 data/*.js，**冇一樣靠
 * Mapbox**。所以地圖死咗，導航照樣行得通，訊息一定要講明呢點，唔好令使用者
 * 以為成個 app 都壞咗。呢個函數只改外觀同文字，唔會停任何功能。
 *
 * 三條進入路徑：冇 mapboxgl、constructor 拋錯、load 事件逾時。第三條涵蓋
 * 「CDN 通但 token 被拒／style 抓唔到」—— 嗰陣 constructor 唔會拋錯，
 * 只係 load 永遠唔會發生。 */
var MAP_LOAD_TIMEOUT_MS = 10000;
var mapFailShown = false;
/* 未壞之前嗰個 aria-label，撤回失敗狀態時要原封不動還原。
   標記本身係靜態中文（`#map` 上面寫死），所以唔可以靠 t() 砌返 ——
   記住原本嗰串係唯一穩陣嘅做法。 */
var mapAriaOriginal = null;

function mapFail() {
  if (mapFailShown) return;
  var el = document.getElementById('map');
  if (el) {
    if (mapAriaOriginal === null) mapAriaOriginal = el.getAttribute('aria-label') || '';
    el.setAttribute('aria-label', t('mapFailAria'));
  }
  mapFailShown = true;
  renderMapFail();
  showToast(t('mapFailToast'));
}

/* 同 applyI18n() 共用：切語言之後呢段文字要跟住轉。 */
function renderMapFail() {
  if (!mapFailShown) return;
  setText('map-fallback-title', t('mapFailTitle'));
  setText('map-fallback-body', t('mapFailBody'));
  var box = document.getElementById('map-fallback');
  if (box) box.hidden = false;
}

/* 逾時係一個**估計**，唔係判決：慢網絡上地圖可以 10 秒之後先 load 好。
   屆時個橫額係錯嘅 —— 一張正常嘅地圖上面蓋住「地圖暫時載入唔到」。
   所以 load 一到就撤回（連 aria-label 一齊還原）。寧願早講咗再收返，
   都好過對著一張正常地圖講佢壞咗。
   個 toast 唔撤回：佢自己會消失，而且佢講嘅「路線同語音導航照常運作」
   當時係真嘅。 */
function mapFailClear() {
  if (!mapFailShown) return;
  mapFailShown = false;
  var box = document.getElementById('map-fallback');
  if (box) box.hidden = true;
  var el = document.getElementById('map');
  if (el && mapAriaOriginal !== null) el.setAttribute('aria-label', mapAriaOriginal);
}

function initMap() {
  if (!window.mapboxgl) { mapFail(); return; }
  mapboxgl.accessToken = CONFIG.MAPBOX_KEY;

  try {
    MAP = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: CONFIG.CENTER,
      zoom: CONFIG.ZOOM,
      attributionControl: true
    });
  } catch (e) { MAP = null; mapFail(); return; }

  /* style／tiles 抓唔到嘅話 load 永遠唔會 fire。逾時就當失敗。
     刻意唔掛 MAP.on('error')：個別圖磚失敗係正常嘅（離線、偶發一秒），
     只有 load 逾時或者根本建唔到先算「地圖唔可用」。用 error 事件判斷會誤報。 */
  var loadTimer = setTimeout(function () {
    if (!mapReady) mapFail();
  }, MAP_LOAD_TIMEOUT_MS);

  MAP.addControl(new mapboxgl.NavigationControl({ showCompass: true }), 'top-right');

  MAP.on('load', function () {
    clearTimeout(loadTimer);
    /* 遲到好過冇到：如果逾時已經報過「載入唔到」，而家要撤回。 */
    mapFailClear();
    mapReady = true;
    applyHighContrast();
    addFacilityMarkers();
    if (S.route) drawRoute(S.route);
  });
}

/* 高對比圖層塗色 —— 每層獨立 try/catch，唔會因為個別圖層名改咗而爆 */
function applyHighContrast() {
  if (!MAP) return;
  var layers = (MAP.getStyle() && MAP.getStyle().layers) || [];
  for (var i = 0; i < layers.length; i++) {
    var L = layers[i];
    try {
      if (L.type === 'background') {
        MAP.setPaintProperty(L.id, 'background-color', '#FFF8F0');
      } else if (L.type === 'water') {
        MAP.setPaintProperty(L.id, 'fill-color', '#BBDEFB');
      } else if (L.type === 'road') {
        var isMajor = /motorway|trunk|primary/i.test(L.id);
        MAP.setPaintProperty(L.id, 'line-color', isMajor ? '#FFFFFF' : '#FFFFFF');
        MAP.setPaintProperty(L.id, 'line-opacity', 0.95);
        if (isMajor) MAP.setPaintProperty(L.id, 'line-width', 7);
      } else if (L.type === 'symbol') {
        MAP.setPaintProperty(L.id, 'text-color', '#1A1A1A');
        MAP.setPaintProperty(L.id, 'text-halo-color', '#FFFFFF');
        MAP.setPaintProperty(L.id, 'text-halo-width', 2.2);
      }
    } catch (e) { /* 圖層唔存在或唔支援 —— 略過 */ }
  }
}

/* 設施標記：形狀 + 顏色雙重編碼，**五個形狀**。
 *
 * 圓=升降機、三角=斜道、方=有蓋通道、階梯形=扶手電梯、菱形=已報告障礙。
 *
 * 為咗低視力用戶，規則係：任何一個形狀嘅**輪廓**都要同其餘四個唔同。
 * 顏色只係第二重編碼 —— 用戶睇唔清顏色嘅時候，輪廓仍然分得出。
 * 所以扶手電梯唔可以係「另一個顏色嘅圓形」，一定要係一個新輪廓：
 * 三級階梯。五個形狀之中只有佢有「級」。
 *
 * 另一條規則：每個形狀入面都要有一個白色圖案講明係「乜」——
 * 只有輪廓嘅話，用戶分得出但睇唔明。低視力唔等於睇唔到，
 * 白色圖案喺深色底上面對比係最高嘅。
 *
 * 顏色一律經 CSS 變數（:root）讀，唔喺呢度再寫一次十六進位。圖例同
 * 地圖標記由**同一個函數**產生 —— 之前兩邊各寫一份 SVG，改一邊就會靜靜
 * 咁走樣（呢個 codebase 反覆出現嘅同一類問題）。
 *
 * disabled：輪椅／推車模式之下，扶手電梯係用唔到嘅，加一道斜線劃掉。
 */
function facilitySvg(kind, px, disabled) {
  var s = px || 40;
  var stroke = ' stroke="#fff" stroke-width="3" stroke-linejoin="round"';
  var shape, inner, fill;

  if (kind === 'lift') {
    fill = 'var(--color-lift)';
    shape = '<circle cx="20" cy="20" r="16.5" fill="' + fill + '"' + stroke + '/>';
    // 上＋落箭嘴：升降機嘅通用圖案
    inner = '<path d="M13.5 12.5l5 8.5h-10z" fill="#fff"/>' +
            '<path d="M26.5 27.5l-5-8.5h10z" fill="#fff"/>';
  } else if (kind === 'ramp') {
    fill = 'var(--color-ramp)';
    shape = '<path d="M20 3l16 31H4z" fill="' + fill + '"' + stroke + '/>';
    // 楔形＝斜台（升起方向同扶手電梯一致：向右上）
    inner = '<path d="M27.5 27.5H12.5L27.5 19z" fill="#fff"/>';
  } else if (kind === 'covered') {
    fill = 'var(--color-covered)';
    shape = '<rect x="3.5" y="3.5" width="33" height="33" rx="4" fill="' + fill +
            '"' + stroke + '/>';
    // 雨傘＝遮雨
    inner = '<path d="M20 11.5a9.5 9.5 0 019.5 9.5h-19a9.5 9.5 0 019.5-9.5z" fill="#fff"/>' +
            '<path d="M20 21v5.5a3 3 0 01-6 0" fill="none" stroke="#fff" ' +
            'stroke-width="2.8" stroke-linecap="round"/>';
  } else if (kind === 'escalator') {
    fill = 'var(--color-escalator)';
    // 三級階梯輪廓 —— 唯一有「級」嘅形狀，剪影都認得出
    shape = '<path d="M4 36V21h7v-5h7v-5h7V6h11v30z" fill="' + fill + '"' + stroke + '/>';
    // 上箭嘴＝向上行
    inner = '<path d="M20 17l6 7h-12z" fill="#fff"/>' +
            '<rect x="18" y="24" width="4" height="9" rx="1.5" fill="#fff"/>';
    if (disabled) {
      // 輪椅／推車模式：呢個設施用唔到 —— 斜線劃掉（唔靠顏色單獨表達）
      inner += '<path d="M8 32L32 8" stroke="#fff" stroke-width="4.6" ' +
               'stroke-linecap="round"/>';
    }
  } else {
    fill = 'var(--color-warn)';
    shape = '<path d="M20 2.5L37.5 20 20 37.5 2.5 20z" fill="' + fill + '"' + stroke + '/>';
    inner = '<path d="M20 9v10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
            '<circle cx="20" cy="25.5" r="2.6" fill="#fff"/>';
  }

  // aria-hidden：地圖標記係裝飾性 —— 設施類型已經由語音提示同圖例傳達，
  // 236 個標記逐個讀出只會淹沒報讀器。
  return '<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="' + s +
         '" height="' + s + '" viewBox="0 0 40 40">' + shape + inner + '</svg>';
}

var MARKERS = [];

/* 設施名（跟當前語言）。設施檔 236 條全部中英齊全。 */
function facilityName(f) {
  if (S.lang === 'en') return f[4] || f[3] || '';
  return f[3] || f[4] || '';
}

/* 設施類別 —— 但以名稱優先過 typeIdx。
 *
 * 設施檔有 17 條叫「又一城扶手電梯」嘅記錄被歸類做 lift。扶手電梯輪椅
 * 用唔到，用「升降機」介紹佢會直接誤導目標用戶。所以名稱同類型矛盾時
 * 以名為準，並且明講「輪椅用唔到」。
 * （長遠應該喺 scripts/build_facilities.py 修正分類，唔係喺前端補救。） */
function isEscalatorName(tc, en) {
  var nm = (tc || '') + ' ' + (en || '');
  return nm.indexOf('扶手電梯') >= 0 || nm.toLowerCase().indexOf('escalator') >= 0;
}

function facilityKind(f, type) {
  return isEscalatorName(f[3], f[4]) ? 'escalator' : type;
}

/* 類別詞由 facilityWord() 一個地方出（見 §6）—— 之前呢度另有一個
   facilityWordFor()，兩份對照表遲早會走樣，而家只留一個入口。 */
function facilityWordFor(kind) {
  return facilityWord(kind);
}

/* 彈出內容。名同類型一樣就唔重複講（設施檔有 23 條就叫「升降機」）。 */
function facilityPopupText(kind, name, g) {
  var label = facilityWordFor(kind);
  var out = label;
  if (name && name !== label && name !== facilityWord(kind)) {
    out = label + ' · ' + name;
  }
  if (kind === 'escalator') out += '（' + t('escWarn') + '）';
  if (kind === 'ramp' && typeof g === 'number' && g > CONFIG.RAMP_OK_G) {
    out += '（' + fmt(g > CONFIG.RAMP_MAX_G ? t('rampTooSteepLabel')
                                            : t('rampSteepLabel'),
                       { p: Math.round(g * 100) }) + '）';
  }
  return out;
}

/* 標記可唔可以點？
 *
 * 可以，而且要滿足 ≥60px 觸控要求 —— 所以外面包一個 60px 嘅點擊區，
 * 圖形本身照舊 40px（任何模式都一樣，見下方 rebuildFacilityMarkers）。用戶報過「點咗冇反應」，原因係呢個
 * 功能由頭到尾冇實作過（全檔冇 Popup、標記冇 click handler）。
 *
 * 標記維持 aria-hidden="true"：236 個裝飾性標記唔應該淹沒報讀器
 * （Phase 4 嘅決定）。所以唔可以話佢支援鍵盤 —— 點擊係指標先有嘅
 * 方便，而同一項資訊會經 #a11y-status live region 報讀，導航行進時
 * 設施提示亦一樣會講。 */
function onFacilityClick(f, type) {
  var kind = facilityKind(f, type);
  var name = facilityName(f);
  /* f[6] = 斜道坡度（rationale 見 CONFIG.RAMP_OK_G）。點標記嘅用戶係主動
     想知呢個設施係咩，坡度就係佢最需要嘅一個數 —— 冇理由收埋。 */
  var g = f[6];
  var text = facilityPopupText(kind, name, g);

  if (MAP && window.mapboxgl) {
    var node = document.createElement('div');
    node.className = 'fac-pop';
    var strong = document.createElement('strong');
    strong.textContent = facilityWordFor(kind);
    node.appendChild(strong);
    if (name) {
      var span = document.createElement('span');
      span.textContent = name;
      node.appendChild(span);
    }
    if (kind === 'ramp' && typeof g === 'number' && g > CONFIG.RAMP_OK_G) {
      var gp = document.createElement('span');
      gp.textContent = fmt(g > CONFIG.RAMP_MAX_G ? t('rampTooSteepLabel')
                                                  : t('rampSteepLabel'),
                           { p: Math.round(g * 100) });
      node.appendChild(gp);
    }
    // 用 setDOMContent + textContent，唔用 setHTML 拼資料字串
    new mapboxgl.Popup({ offset: 30, closeButton: true, closeOnClick: true })
      .setLngLat([f[0], f[1]]).setDOMContent(node).addTo(MAP);
  }

  // remember=false：唔可以蓋掉「再講一次」記住嘅導航指令。
  // 優先級 0 永遠唔會搶轉向提示。
  narratorSay(text, 0, 'facinfo', false);
}

/* 重畫設施標記。天氣轉嘅時候一定要重畫 —— 有蓋通道標記會加光暈。
   （曾經亦會放大到 56px；2026-09-23 用戶要求全部圖示大小一致，已移除。）
   之前 addFacilityMarkers() 只在 MAP.on('load') 叫過一次，所以呢個效果
   由頭到尾冇生效過。 */
/* 清空收埋喺 addFacilityMarkers() 度（見嗰個函式嘅註解），所以呢度淨係轉發。 */
function rebuildFacilityMarkers() {
  if (!MAP) return;
  addFacilityMarkers();
}

/* 一個有蓋結構＝一個標記。
 *
 * 有蓋通道係**連續結構**，但資料係一段一段落點：實測 132 個有蓋標記
 * 分成 37 組，**24 組多過一個**，最大一組 12 個全部喺大坑東道天橋，
 * 南昌街天橋亦有 11 + 10 個。地圖上就係同一條橋插住一疊圖標 ——
 * 用戶報「有蓋通道嘅標識有重複、冗餘」。
 *
 * 每組只畫一個，揀組內**最接近用戶路線**嗰個（即用戶行到最接近嗰一點）——
 * 呢個就係「只顯示離用戶最近嘅一個」。未揀路線時冇「用戶位置」可言，
 * 跟資料次序取頭一個。
 *
 * 只做有蓋：升降機同斜道每一個都係獨立設施，各自有意義，唔應該合併。
 */
var COVER_CLUSTER_M = 40;

function distToRoute(route, f) {
  var pts = route.pts, bd = Infinity;
  for (var j = 0; j < pts.length - 1; j++) {
    var ax = pts[j][0], ay = pts[j][1], cx = pts[j + 1][0], cy = pts[j + 1][1];
    var dx = cx - ax, dy = cy - ay, len2 = dx * dx + dy * dy;
    var u = len2 === 0 ? 0 : ((f[0] - ax) * dx + (f[1] - ay) * dy) / len2;
    u = Math.max(0, Math.min(1, u));
    var d = metersBetween(f[0], f[1], ax + u * dx, ay + u * dy);
    if (d < bd) bd = d;
  }
  return bd;
}

function coveredDrawSet(list, types) {
  var cov = [];
  for (var i = 0; i < list.length; i++) {
    if (types[list[i][2]] === 'covered') cov.push(i);
  }
  var route = S.route;
  if (route && route.pts && route.pts.length > 1) {
    cov.sort(function (a, b) {
      return distToRoute(route, list[a]) - distToRoute(route, list[b]);
    });
  }
  var keep = {}, kept = [];
  for (var k = 0; k < cov.length; k++) {
    var idx = cov[k], ok = true;
    for (var j = 0; j < kept.length; j++) {
      if (metersBetween(list[idx][0], list[idx][1],
                        list[kept[j]][0], list[kept[j]][1]) < COVER_CLUSTER_M) {
        ok = false;
        break;
      }
    }
    if (ok) { kept.push(idx); keep[idx] = true; }
  }
  return keep;
}

/* ⚠ 呢個函式一定要**先清再畫**，唔可以淨係畫。
 *
 * 佢有兩個互相獨立、非同步嘅入口：
 *   1. MAP.on('load')                —— 要等 Mapbox 抓完 style／sprite／glyphs／tiles
 *   2. setRain() ← fetchWeather()    —— init 之後一個 Open-Meteo request
 * 邊個先到取決於網絡，兩個次序都實測出現過。
 *
 * 以前清空嘅責任喺 rebuildFacilityMarkers()，即係只有第二條路徑會清。所以
 * 只要天氣回應快過地圖 load（一個 request vs 幾個 round trip，通常就係咁），
 * load 就會喺已經畫好嘅 147 個標記上面**再畫 147 個** —— 地圖上每個設施都有
 * 兩個圖示，而且會一直維持到用戶揀路線為止（揀路線會經 setRain 重新整理，
 * 所以之前量到 147 係因為量嗰陣已經開始行路線）。
 *
 * 症狀同用戶 2026-09-23 報嘅「有蓋通道嘅標識有重複嘅，顯得比較冗餘」係同一類，
 * 只係今次係**所有**設施而唔止有蓋通道。清空收埋喺呢度之後，兩個入口都安全，
 * 唔再靠「入口記得自己清」。
 */
function addFacilityMarkers() {
  var FAC = dataOrNull('KT_FACILITIES');
  if (!MAP || !FAC) return;
  for (var k = 0; k < MARKERS.length; k++) {
    if (MARKERS[k].marker) MARKERS[k].marker.remove();
  }
  MARKERS = [];
  var types = FAC.types;
  var list = FAC.list;
  var drawCover = coveredDrawSet(list, types);

  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    var type = types[f[2]];
    // 形狀跟**名稱優先**嘅類別（見 facilityKind）。設施檔有 29 條
    // 「…扶手電梯」被歸類做 lift，之前全部畫成一個藍色圓形 ——
    // 即係用地圖話輪椅用戶「呢度有升降機」。名稱同類型矛盾時以名為準。
    var kind = facilityKind(f, type);
    if (kind === 'covered' && !drawCover[i]) continue;   // 同一個結構：已經畫過
    // 雨天模式：有蓋通道標記加光暈。
    // 唔再放大 —— 用戶 2026-09-23 要求所有設施圖示大小一致（以斜道為準）。
    // 之前有蓋通道喺雨天會變 56px，比其他設施嘅 40px 大四成。
    var glow = S.rain && kind === 'covered';
    var px = 40;
    // 輪椅／推車模式之下，扶手電梯係用唔到嘅設施 —— 標記劃斜線講明
    var off = (kind === 'escalator' && S.wheel);

    // 60px 點擊區包住圖形（圖形本身維持 40px，唔會被拉大）
    var el = document.createElement('div');
    el.className = 'fac-hit';
    el.style.cssText = 'width:60px;height:60px;display:flex;align-items:center;' +
      'justify-content:center;cursor:pointer;';
    el.innerHTML = '<span style="display:block;width:' + px + 'px;height:' + px +
      'px;' + (glow ? 'filter:drop-shadow(0 0 10px var(--color-covered-glow));' : '') +
      '">' + facilitySvg(kind, px, off) + '</span>';
    el.setAttribute('aria-hidden', 'true');

    (function (fac, tp, node) {
      node.addEventListener('click', function (ev) {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        onFacilityClick(fac, tp);
      });
    })(f, type, el);

    var mk = new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat([f[0], f[1]]).addTo(MAP);
    MARKERS.push({ marker: mk, kind: kind, el: el, base: 40, f: f });
  }
}

var routeLayerReady = false;
function drawRoute(route) {
  if (!MAP || !mapReady) return;
  var coords = route.pts;
  var geo = { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } };

  try {
    if (MAP.getSource('route')) {
      MAP.getSource('route').setData(geo);
    } else {
      MAP.addSource('route', { type: 'geojson', data: geo });
      // 白色底線提升對比，再疊深藍主線
      MAP.addLayer({
        id: 'route-casing', type: 'line', source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#FFFFFF', 'line-width': 13 }
      });
      MAP.addLayer({
        id: 'route-main', type: 'line', source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#1A237E', 'line-width': 7 }
      });
      routeLayerReady = true;
    }
  } catch (e) { /* 圖層已存在 */ }

  var b = new mapboxgl.LngLatBounds();
  for (var i = 0; i < coords.length; i++) b.extend(coords[i]);
  MAP.fitBounds(b, { padding: 60, duration: prefersReducedMotion() ? 0 : 600 });
}

function moveWalkerMarker(lng, lat) {
  if (!MAP) return;
  if (!moveWalkerMarker._mk) {
    var el = document.createElement('div');
    el.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" ' +
      'width="52" height="52" ' +
      'viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" ' +
      'stroke-linecap="round"><circle cx="12" cy="4.6" r="2.6" fill="#fff"/>' +
      '<path d="M12 7.4v6.2M12 13.6h5.2l2.6 6.4M12 13.6H6.8l-2.6 6.4"/>' +
      '<path d="M12 13.6l-3.2 6.4M12 13.6l3.2 6.4"/></svg>';
    el.style.cssText = 'width:52px;height:52px;background:#B71C1C;border:3px solid #fff;' +
      'border-radius:50%;box-shadow:0 3px 12px rgba(0,0,0,.4);padding:2px;';
    moveWalkerMarker._mk = new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat([lng, lat]).addTo(MAP);
  } else {
    moveWalkerMarker._mk.setLngLat([lng, lat]);
  }
}

function prefersReducedMotion() {
  return window.matchMedia &&
         window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* ===== 10. 模擬步行 =====================================================
   位置來源抽象化：walker 每 tick 前進「米」，唔係跳 vertex index。
   位置連續推進 → 永遠唔會跳過觸發窗口。
   日後換成 GPS provider 只需要換掉呢個物件。
   ====================================================================== */

var walker = {
  // 由沿線距離 s 取經緯度
  pointAt: function (route, s) {
    var cum = route.cum, pts = route.pts, i;
    if (s <= 0) return pts[0];
    if (s >= route.total) return pts[pts.length - 1];
    for (i = 0; i < cum.length - 1; i++) {
      if (s >= cum[i] && s <= cum[i + 1]) {
        var segLen = cum[i + 1] - cum[i];
        var u = segLen > 0 ? (s - cum[i]) / segLen : 0;
        return [
          pts[i][0] + u * (pts[i + 1][0] - pts[i][0]),
          pts[i][1] + u * (pts[i + 1][1] - pts[i][1])
        ];
      }
    }
    return pts[pts.length - 1];
  },

  /* begin：由頭開始（s = 0） */
  begin: function (route, speed) {
    S.walk = { s: 0, speed: speed, playing: false, timer: null,
               route: route, arrived: false, introHold: false, holdMs: 0 };
    this.run();
  },

  /* run：由目前 s 繼續。resume 一定要用呢個 ——
     之前 resume 錯誤咁再叫 begin，會將位置重設返 0，
     即係「暫停後再播」會由起點重新行過。 */
  run: function () {
    var w = S.walk;
    if (!w || w.arrived) return;
    w.playing = true;
    if (w.timer) clearTimeout(w.timer);
    w.timer = setTimeout(this._tick(), CONFIG.TICK_MS);
  },

  _tick: function () {
    var self = this;
    return function tick() {
      var w = S.walk;
      if (!w || !w.playing) return;

      /* 升降機停留中：唔行、唔觸發，只係等。
       *
       * 呢個 counter 一定要放喺 tick 鏈裡面（而唔係自己一個 setTimeout）：
       * tick 鏈係可以暫停嘅（pause 清 timer，resume 重新接上），游離嘅
       * timer 會繞過暫停，用戶撳咗暫停個點仲會自己行落去。 */
      if (w.holdMs > 0) {
        w.holdMs -= CONFIG.TICK_MS;
        if (w.holdMs > 0) { w.timer = setTimeout(tick, CONFIG.TICK_MS); return; }
        w.holdMs = 0;
      }

      /* 減速總督：講緊嘢嘅時候行慢啲。
       *
       * 語音同位置一定要解耦（舊 app 就係 await 語音，先會漏轉向），
       * 但完全唔理就會出現「一句未講完，下一個觸發窗已經到」。用戶明確
       * 批准用減速換取語音唔打架 —— 而且長者行慢啲本身就更安全，
       * 亦多啲時間準備轉向。冇語音時全速，所以唔會拖慢成程。 */
      var step = w.speed * (S.speedMul || 1);
      if (narrator.busy) {
        /* 加速倍數喺呢度**一定要讓路**：講緊嘢嘅時候由總督話事。
           所以 4 倍速係「兩句之間行快啲」，唔係「語音追唔上」——
           用戶要求「語音也要跟得上」，呢個就係跟得上嘅保證。 */
        step = Math.max(w.speed * CONFIG.SPEAK_SLOW, CONFIG.SPEAK_SLOW_MIN);
      }
      w.s += step * (CONFIG.TICK_MS / 1000);
      if (w.s >= w.route.total) w.s = w.route.total;

      var p = self.pointAt(w.route, w.s);
      moveWalkerMarker(p[0], p[1]);

      // 轉向／設施／地標觸發 —— 非阻塞，唔會等語音
      checkTriggers(w.route, w.s);

      /* 行到升降機邊 → 停 LIFT_HOLD_MS 模擬搭𨋢，並報一句。
         兩個細節：
          · 用 `w.s - lf.s` 嘅差距做保險：報告「此路不通」之後會由目前位置
            重算路線，新路線可能有部𨋢喺**後面**，唔應該無啦啦停低重播
            （實測報告改道會令呢個情況出現）。
          · 只喺呢度做一次（lf.done），否則每一格都會再停五秒。 */
      var lifts = w.route.lifts || [];
      for (var li = 0; li < lifts.length; li++) {
        var lf = lifts[li];
        if (lf.done || w.s < lf.s) continue;
        lf.done = true;
        if (w.s - lf.s > 12) continue;
        w.holdMs = CONFIG.LIFT_HOLD_MS;
        /* 「埋身」嗰句由呢度講（轉向軌講 60 米同 20 米兩段）——
           停低同旁白一定要係同一件事，所以兩樣喺同一個地方發生。
           樓層名由**落腳點** zB 查（見 CONFIG.MALL_LEVELS）—— 唔係
           「上就 zB、落就 zA」：zB 永遠係出𨋢嗰層。查唔到就淨講方向。 */
        var lv = levelName(lf.zB);
        narratorSay(lv
          ? fmt(t('nLiftNowLevel'), { level: lv, uw: t(lf.dz >= 0 ? 'liftUpWord' : 'liftDownWord') })
          : t(lf.dz >= 0 ? 'nLiftUp' : 'nLiftDown'), 3, 'lift' + li);
      }

      narratorDrain();                 // 補播之前被搶佔嘅提示
      updateProgress(w.route, w.s);

      if (w.s >= w.route.total && !w.arrived) {
        w.arrived = true;
        w.playing = false;
        renderArrived(w.route);
        // 到達一定要講得出，所以用最高優先級（4 > 轉向嘅 3）。
        // 之前用 3，會同轉向提示同級而被丟棄，加上行完之後唔會再 tick，
        // narratorDrain 亦冇機會補播 —— 結果到達提示永遠消失。
        narratorSay(fmt(t('nArrive'), {
          destination: t(S.routeKey === 'A' ? 'destA' : 'destB')
        }), 4, 'arrive');
        setPlayButton(true);
        return;
      }
      w.timer = setTimeout(tick, CONFIG.TICK_MS);
    };
  },

  pause: function () {
    if (S.walk) {
      S.walk.playing = false;
      if (S.walk.timer) clearTimeout(S.walk.timer);
    }
  },

  resume: function () {
    if (!S.walk || S.walk.arrived) return;
    this.run();
  }
};

 * 「雨天有蓋標記放大」由頭到尾冇生效過 —— 收埋喺呢度就順手修好。 */

/* 圖例：五個形狀同地圖標記一一對應。
 *
 * 圖示由 facilitySvg() 產生，同地圖標記係同一個來源 —— 兩邊各寫一份
 * SVG 嘅話，改咗一邊就會靜靜咁唔一致（呢個 codebase 反覆出現嘅同一類問題）。
 * 文字跟語言，扶手電梯嗰項仲要跟輪椅模式：輪椅模式講明「唔適用」，
 * 而且圖示同樣劃斜線，同地圖上嗰 29 個標記一致。 */
function renderLegend() {
  var ico = { 'lg-ico-lift': 'lift', 'lg-ico-ramp': 'ramp',
              'lg-ico-covered': 'covered', 'lg-ico-escalator': 'escalator',
              'lg-ico-blocked': 'blocked' };
  for (var id in ico) {
    if (!ico.hasOwnProperty(id)) continue;
    var el = document.getElementById(id);
    if (el) el.innerHTML = facilitySvg(ico[id], 32, ico[id] === 'escalator' && S.wheel);
  }
  setText('lg-lift', t('lgLift'));
  setText('lg-ramp', t('lgRamp'));
  setText('lg-covered', t('lgCovered'));
  setText('lg-escalator', t('lgEscalator') + ' ' + (S.wheel ? t('lgEscOff') : t('lgEscOn')));
  setText('lg-blocked', t('lgBlocked'));
}

/* 輪椅／推車模式開關。
 *
 * 用戶帶住輪椅或者推車就揀「有」—— 扶手電梯用唔到，所以標記劃斜線、
 * 語音唔講。冇帶就揀「冇」，扶手電梯照標照講。
 *
 * ⚠ 呢個開關**唔會改路線**（用戶今次明確只要求改圖標、語言、質素卡）。
 * 而且改路線亦冇用，實測過：圖內扶手電梯邊只有 41 條、總長 257 米，
 * 全部喺九龍塘站／又一城建築群內部；五個成本模型（硬排除／開放／
 * 偏好 0.7／0.3／連樓梯都開放）行出嚟嘅節點序列**完全一樣**，
 * 路線 A 639 米、路線 B 465 米，用到嘅扶手電梯都係 0 條。
 * 由 1,200 個隨機目的地抽查，只有 1 個（0.1%）有槓桿，而且喺 z ≥ 40 米
 * 嘅山坡上。所以「幫你規劃扶手電梯路線」係做唔到嘅事，唔可以扮。
 */
function setWheel(v) {
  S.wheel = !!v;
  rebuildFacilityMarkers();   // 29 個扶手電梯標記要加／除斜線
  renderLegend();
  updateWheelButton();
  updateModeNote();
  if (S.route) {
    /* 旁述軌要重算：輪椅模式剔除扶手電梯，一般模式放行。
       只重算旁述，唔重新規劃路線 —— 路線唔受呢個開關影響。 */
    S.route.cues = selectCues(S.route.pts, S.route.cum, S.route.zs,
                              S.route.path, S.route.facilities);
    /* 新 cue 物件嘅 announced 全部係 false，而 cue 觸發條件
       `s >= c.s - 15` **冇上界** —— 唔標記嘅話，行到一半轉一次輪椅模式，
       身後每一個 cue 都會即刻連續補播（「左手邊係…，有升降機」一次過
       講幾句）。呢個係原本就有嘅 bug，唔係重算路線帶出嚟嘅。
       方向係單向 true，所以唔會影響未行到嘅 cue。 */
    markPassedAsAnnounced(S.route, S.walk ? S.walk.s : 0);
  }
}
